# skill-up 评测入口 —— MingLi-Bench 命盘分组版（32 命盘 × 4-6 题 = 160 题）· qwen_code 标准模式
# 用法：
#   bash evals/run-qwen.sh   （自动：移走答案→跑评测→恢复答案→判分）
schema_version: v1alpha1

skills:
  - source: local_path
    path: .

environment:
  type: docker
  image: liki-qwen:1
  workspace_mount: /workspace
  env:
    # 不硬编码 key：运行前 export OPENAI_API_KEY（qwen_code 引擎自动注入）
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OPENAI_BASE_URL: https://api.deepseek.com/v1

engine:
  name: qwen_code
  model:
    name: deepseek-v4-flash

cases:
  files:
    - evals/cases-grouped/pan01.yaml
    - evals/cases-grouped/pan02.yaml
    - evals/cases-grouped/pan03.yaml
    - evals/cases-grouped/pan04.yaml
    - evals/cases-grouped/pan05.yaml
    - evals/cases-grouped/pan06.yaml
    - evals/cases-grouped/pan07.yaml
    - evals/cases-grouped/pan08.yaml
    - evals/cases-grouped/pan09.yaml
    - evals/cases-grouped/pan10.yaml
    - evals/cases-grouped/pan11.yaml
    - evals/cases-grouped/pan12.yaml
    - evals/cases-grouped/pan13.yaml
    - evals/cases-grouped/pan14.yaml
    - evals/cases-grouped/pan15.yaml
    - evals/cases-grouped/pan16.yaml
    - evals/cases-grouped/pan17.yaml
    - evals/cases-grouped/pan18.yaml
    - evals/cases-grouped/pan19.yaml
    - evals/cases-grouped/pan20.yaml
    - evals/cases-grouped/pan21.yaml
    - evals/cases-grouped/pan22.yaml
    - evals/cases-grouped/pan23.yaml
    - evals/cases-grouped/pan24.yaml
    - evals/cases-grouped/pan25.yaml
    - evals/cases-grouped/pan26.yaml
    - evals/cases-grouped/pan27.yaml
    - evals/cases-grouped/pan28.yaml
    - evals/cases-grouped/pan29.yaml
    - evals/cases-grouped/pan30.yaml
    - evals/cases-grouped/pan31.yaml
    - evals/cases-grouped/pan32.yaml
  defaults:
    timeout_seconds: 2400
    max_turns: 20

report:
  formats: [json, markdown]
