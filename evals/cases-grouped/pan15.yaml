# MingLi-Bench 分组 case: pan15（命盘 15/32，5 题）
# 题目与答案分离：答案见 evals/answers.json（判分进程专用）
id: pan15
title: "命盘15：此命出身的贫或富？"
input:
  prompt: |
    出生信息：女命：西历2002年6月1日早上08:30辰时  出生于香港
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：此命出身的贫或富？
    选项：
    A.孤儿院长大
    B.贫穷家庭出身
    C.小康之家出身
    D.大富贵家庭出身
    
    【题2】问题：此命的学历/教育程度如何？
    选项：
    A.大学毕业
    B.正在修读硕士/研究生
    C.小学毕业
    D.中六毕业
    
    【题3】问题：以上那一年份有拍拖/恋爱？
    选项：
    A.2018年
    B.2019年
    C.2020年
    D.以上时间都有男朋友
    
    【题4】问题：2022年在姻缘方面如何?
    选项：
    A.结婚
    B.奉子成婚
    C.离婚
    D.分手
    
    【题5】问题：2022年命主发生什么大事？
    选项：
    A.事业上有好机遇，参加比赛得奖
    B.在日本成为一位名侦探
    C.母亲急病逝世
    D.有横财运，中六合彩头奖
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"
