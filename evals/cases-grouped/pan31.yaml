    【题2】问题：命主大学时期读什么科系？
    选项：
    A.音乐
    B.金融
    C.美术
    D.理工
    
    【题3】问题：命主目前的婚姻状况为何？
    选项：
    A.未婚单身
    B.已婚育有子女
    C.已婚未育
