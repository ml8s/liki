# MingLi-Bench 分组 case: pan01（命盘 1/32，5 题）
# 题目与答案分离：答案见 evals/answers.json（判分进程专用）
id: pan01
title: "命盘1：此命1996年发生何事？"
input:
  prompt: |
    出生信息：男命：1974年4月28日下午4:40分 出生地点：usa
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：此命1996年发生何事？
    选项：
    A.患上严重抑郁痴
    B.回港认识现任妻子
    C.交通意外，撞车，人平安
    D.得到一笔意外之财
    
    【题2】问题：此命何年结婚？
    选项：
    A.1999
    B.2002
    C.2006
    D.到2022年为止，单身
    
    【题3】问题：此命2008年发生何事？
    选项：
    A.买卖股票，输了很多钱
    B.与朋友合作生意，赚了很多钱
    C.祖母过世，自己生病，要一段时间长期食药
    D.交通意外，发现有遗传病
    
    【题4】问题：此命父亲是那一年仙逝？
    选项：
    A.2009
    B.2013
    C.2018
    D.2020
    
    【题5】问题：此命2020年发生何事？
    选项：
    A.工作升职得财
    B.因长期食药，导致健康出问题
    C.此年太太怀孕，得子
    D.因病逝世
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"
