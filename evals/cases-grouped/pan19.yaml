id: pan19
title: "命盘19：大约那段时间，运程最好？"
input:
  prompt: |
    出生信息：男命：1961年12月30日 02:00丑
    
    以下是同一命盘（同一位命主）的 6 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 6 道题（不要每题重新排盘）。
    
    【题1】问题：大约那段时间，运程最好？
    选项：
    A.23---32岁
    B.33---42岁
    C.43---52岁
    D.53---62岁
    
    【题2】问题：什么时候结婚？
    选项：
    A.23—32岁
    B.33—42岁
    C.43—52岁
    D.没有结婚
    
    【题3】问题：有官非刑事出现的时间吗？
    选项：
    A.13---22岁
    B.23---32岁
    C.33---42岁
    D.43---53岁
    
    【题4】问题：有凶劫之灾出现的时间？
    选项：
    A.1965年4岁
    B.1968年7岁
    C.1971年10岁
    D.1974年13岁
    
    【题5】问题：哪一个，破财最严重？
    选项：
    A.23---32岁
    B.33---42岁
    C.43---52岁
    D.53---62岁
    
    【题6】问题：命主有夫妻，目前是第几段婚姻？
    选项：
    A.第1段
    B.第2段
    C.第3段
    D.失婚
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-6，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"
