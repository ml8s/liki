description: >-
  Liki Astrologer (Pro) covers BaZi, Zi Wei Dou Shu, Liu Yao, Qi Men, Feng
  Shui, date selection and naming, with deterministic, traceable readings.
  Traditional view; not professional advice.

mcpServers:
  - name: engine
    endpointEnv: LIKI_ENGINE_URL
  - name: counsel
    endpointEnv: LIKI_COUNSEL_URL

agent:
  name: liki
  mode: chat
  skills:
    root: /skills
  tools:
    allow:
      skilltoolset:
        - list_skills
        - load_skill
        - load_skill_resource
      engine:
        - time_now
        - subject_candidates
        - city_info
        - huangli_days
        - bazi_chart
        - ziwei_chart
        - bazi_liupan
        - ziwei_liupan
        - bazi_bond
        - ziwei_bond
        - bazhai_chart
        - bazhai_layout
        - xuankong_chart
        - xuankong_liunian
        - liuyao_qigua
      counsel:
        - bazi_yongshen
        - natal_query
        - natal_liunian_query
        - naming_surname
        - naming_pick
        - naming_character
        - naming_compose
        - naming_check
        - liuyao_ask
        - qimen_ask
