name: Release candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source ref to build'
        required: true
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-release-candidate-liki-${{ github.event.inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-gate:
    name: Source and release artifact gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Build release artifacts
        run: make build-release-manifest

      - name: Create release verification bundle
        run: |
          tar -czf liki-release-artifacts.tar.gz -C dist \
            agents/experts/deployment.json \
            agents/single/deployment.json \
            index.json \
            liki-release-manifest.json \
            liki-release-manifest.sha256 \
            liki-web-skill-bundle.tar.gz \
            liki.tar.gz

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: liki-release-artifacts
          path: liki-release-artifacts.tar.gz
          retention-days: 30

  engine-candidate:
    name: Engine candidate image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: source-gate
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - id: meta
        run: echo "tag=candidate-${GITHUB_SHA::7}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./engine
          file: ./engine/dev/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
          tags: ghcr.io/${{ github.repository_owner }}/liki-engine:${{ steps.meta.outputs.tag }}

      - name: Smoke published engine MCP image
        run: |
          trap 'docker rm -f engine-candidate-smoke 2>/dev/null || true' EXIT
          docker run -d --name engine-candidate-smoke \
            --entrypoint /usr/local/bin/engine-mcp \
            -p 18081:8081 \
            ghcr.io/${{ github.repository_owner }}/liki-engine:${{ steps.meta.outputs.tag }}
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/health && break
            sleep 1
          done
          python scripts/test_engine_mcp.py http://127.0.0.1:18081/mcp

      - name: Smoke retained engine-rpc compatibility image runtime
        run: |
          trap 'docker rm -f engine-rpc-candidate-smoke 2>/dev/null || true' EXIT
          docker run -d --name engine-rpc-candidate-smoke \
            --entrypoint /usr/local/bin/engine-rpc \
            -p 18083:8080 \
            ghcr.io/${{ github.repository_owner }}/liki-engine:${{ steps.meta.outputs.tag }}
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18083/health && break
            sleep 1
          done
          body='{"jsonrpc":"2.0","id":1,"method":"rpc.discover","params":{}}'
          curl -fsS -X POST http://127.0.0.1:18083/jsonrpc \
            -H 'Content-Type: application/json' \
            --data "$body" | grep -q 'openrpc'

  counsel-candidate:
    name: Counsel candidate image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: source-gate
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - id: meta
        run: echo "tag=candidate-${GITHUB_SHA::7}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./counsel/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
          tags: ghcr.io/${{ github.repository_owner }}/liki-counsel:${{ steps.meta.outputs.tag }}

      - name: Smoke published counsel image
        run: |
          trap 'docker rm -f counsel-candidate-smoke 2>/dev/null || true' EXIT
          docker run -d --name counsel-candidate-smoke -p 18086:8086 \
            -e LIKI_MCP_URL=http://127.0.0.1:9/mcp \
            ghcr.io/${{ github.repository_owner }}/liki-counsel:${{ steps.meta.outputs.tag }}
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18086/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18086/healthz | grep -q '"status":"ok"'

  assembly-candidate:
    name: Expert assembly candidate images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [source-gate, engine-candidate, counsel-candidate]
    outputs:
      experts_digest: ${{ steps.multi.outputs.digest }}
      single_digest: ${{ steps.single.outputs.digest }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Generate deployment artifacts
        run: make build-deployment

      - name: Stage assembly context
        run: |
          rm -rf assembly/dist
          mkdir -p assembly/dist/agents
          cp -r dist/agents/. assembly/dist/agents/
          cp -r skills assembly/dist/skills
          cp -r expert-packs assembly/dist/expert-packs

      - id: meta
        run: echo "tag=candidate-${GITHUB_SHA::7}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Validate pinned runtime base
        id: base
        run: |
          python3 scripts/liki_agents_pin.py --check
          AGENTS_VERSION="$(python3 scripts/liki_agents_pin.py --version)"
          AGENTS_DIGEST="$(python3 scripts/liki_agents_pin.py --digest)"
          base_ref="ghcr.io/${{ github.repository_owner }}/liki-agents@${AGENTS_DIGEST}"
          docker pull "$base_ref"
          case "$base_ref" in
            "ghcr.io/${{ github.repository_owner }}/liki-agents@${AGENTS_DIGEST}") ;;
            *) echo "::error::runtime base digest mismatch" >&2; exit 1 ;;
          esac
          echo "ref=$base_ref" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: multi
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./assembly
          file: ./assembly/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
            PROFILE=experts
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
          tags: ghcr.io/${{ github.repository_owner }}/liki-multi-expert:${{ steps.meta.outputs.tag }}

      - id: single
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./assembly
          file: ./assembly/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
            PROFILE=single
            VERSION=${{ steps.meta.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
          tags: ghcr.io/${{ github.repository_owner }}/liki-single-expert:${{ steps.meta.outputs.tag }}

      - name: Validate candidate assemblies
        run: |
          for img in \
            ghcr.io/${{ github.repository_owner }}/liki-multi-expert:${{ steps.meta.outputs.tag }} \
            ghcr.io/${{ github.repository_owner }}/liki-single-expert:${{ steps.meta.outputs.tag }}; do
            docker pull "$img"
            docker run --rm "$img" validate -deployment /deployment/deployment.json
          done

      - name: Write candidate digest manifest
        run: |
          python3 - <<'PY'
          import json
          manifest = {
              "repository": "${{ github.repository }}",
              "source_commit": "${{ github.sha }}",
              "candidate_run_id": "${{ github.run_id }}",
              "candidate_tag": "${{ steps.meta.outputs.tag }}",
              "images": {
                  "engine": "${{ needs.engine-candidate.outputs.digest }}",
                  "counsel": "${{ needs.counsel-candidate.outputs.digest }}",
                  "experts": "${{ steps.multi.outputs.digest }}",
                  "single_expert": "${{ steps.single.outputs.digest }}"
              }
          }
          with open("candidate-digests.json", "w") as f:
              json.dump(manifest, f, sort_keys=True, indent=2)
              f.write("\n")
          PY

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: candidate-digests
          path: candidate-digests.json
          retention-days: 30
