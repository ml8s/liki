name: Release

# Tag-driven release for ml8s/liki. Builds and signs the three release images,
# then publishes this tag's GitHub Release. The release asset
# `candidate-digests.json` is the cross-repository contract that liki-deploy
# consumes; this workflow never deploys anything.

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Guard release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::tag $tag is not CalVer vYYYY.MM.DD.N" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $tag does not point at a main commit" >&2
            exit 1
          fi
          for repo in liki-engine liki-counsel liki-experts; do
            if docker buildx imagetools inspect "ghcr.io/ml8s/$repo:$tag" >/dev/null 2>&1; then
              echo "::error::$repo:$tag already exists; release tags are immutable" >&2
              exit 1
            fi
          done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub release $tag already exists" >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - run: python -m pip install pyyaml jsonschema pydantic==2.13.5 ruff==0.16.0 coverage pytest

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: engine

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 镜像包已 link 到本仓（promote 用 job token 推过）；job token 可推可拉。
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Release gate
        run: make release-gate

      - name: Build and push release images
        id: images
        run: RELEASE_VERSION="${GITHUB_REF_NAME#v}" scripts/release-images.sh

      - name: Sign and verify release images
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"
          for spec in \
            "liki-engine:${{ steps.images.outputs.engine_digest }}" \
            "liki-counsel:${{ steps.images.outputs.counsel_digest }}" \
            "liki-experts:${{ steps.images.outputs.experts_digest }}"; do
            name="${spec%%:*}"
            digest="${spec#*:}"
            echo "── signing ghcr.io/ml8s/$name@$digest ──"
            cosign sign --yes "ghcr.io/ml8s/$name@$digest"
            cosign verify "ghcr.io/ml8s/$name@$digest" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: Build signed release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ENGINE_DIGEST: ${{ steps.images.outputs.engine_digest }}
          COUNSEL_DIGEST: ${{ steps.images.outputs.counsel_digest }}
          EXPERTS_DIGEST: ${{ steps.images.outputs.experts_digest }}
          LIKI_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          export LIKI_RELEASE_TAG="$RELEASE_TAG"
          LIKI_RELEASE_IMAGES="$(jq -n \
            --arg engine "$ENGINE_DIGEST" \
            --arg counsel "$COUNSEL_DIGEST" \
            --arg experts "$EXPERTS_DIGEST" \
            '{engine: $engine, engine_mcp: $engine, counsel_mcp: $counsel, experts: $experts}')"
          export LIKI_RELEASE_IMAGES
          python3 scripts/build_release_manifest.py --require-images
          cosign sign-blob --yes \
            --output-signature dist/liki-release-manifest.sig \
            --output-certificate dist/liki-release-manifest.crt \
            dist/liki-release-manifest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "liki $GITHUB_REF_NAME" \
            --generate-notes \
            build/release/candidate-digests.json \
            dist/liki-release-manifest.json \
            dist/liki-release-manifest.sha256 \
            dist/liki-release-manifest.sig \
            dist/liki-release-manifest.crt \
            dist/liki.tar.gz \
            dist/index.json \
            dist/liki-web-skill-bundle.tar.gz \
            dist/liki-web-skill-bundle.manifest.json \
            dist/liki-web-skill-bundle.sha256 \
            dist/agents/experts/deployment.json
