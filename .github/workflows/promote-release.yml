name: Promote release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix'
        required: true
        type: string
      candidate_run_id:
        description: 'Successful candidate run id'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-promote-release-liki-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate candidate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Validate release ref
        run: |
          set -euo pipefail
          expected="v${{ inputs.version }}"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "::error::workflow must be dispatched on tag $expected" >&2
            exit 1
          fi

      - name: Download candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download '${{ inputs.candidate_run_id }}' -n candidate-digests -D candidate
          gh run download '${{ inputs.candidate_run_id }}' -n liki-release-artifacts -D candidate-artifacts

      - name: Validate digest manifest
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open('candidate/candidate-digests.json'))
          required={'engine','counsel','experts','single_expert'}
          assert set(m['images']) == required
          assert all(v.startswith('sha256:') for v in m['images'].values())
          assert m['candidate_run_id'] == '${{ inputs.candidate_run_id }}'
          PY

  promote:
    name: Promote tested image digests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: validate
    outputs:
      engine_digest: ${{ steps.promote.outputs.engine_digest }}
      engine_mcp_digest: ${{ steps.promote.outputs.engine_digest }}
      counsel_digest: ${{ steps.promote.outputs.counsel_digest }}
      experts_digest: ${{ steps.promote.outputs.experts_digest }}
      single_digest: ${{ steps.promote.outputs.single_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: promote
        name: Retag tested candidate digests
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open('candidate/candidate-digests.json'))
          mapping={
            'engine': 'liki-engine',
            'counsel': 'liki-counsel',
            'experts': 'liki-multi-expert',
            'single_expert': 'liki-single-expert',
          }
          with open('promote.sh','w') as f:
            f.write('set -euo pipefail\n')
            for key,image in mapping.items():
              digest=m['images'][key]
              source=f'ghcr.io/${{ github.repository_owner }}/{image}@{digest}'
              target=f'ghcr.io/${{ github.repository_owner }}/{image}:${{ inputs.version }}'
              f.write(f'docker buildx imagetools create -t {target!r} {source!r}\n')
          print(f'{key}_digest={digest}')
          PY
          bash promote.sh
          for key in engine counsel experts single_expert; do
            digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["images"][sys.argv[2]])' candidate/candidate-digests.json "$key")"
            echo "${key}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
          echo "engine_mcp_digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["images"]["engine"])' candidate/candidate-digests.json)" >> "$GITHUB_OUTPUT"

      - name: Smoke promoted images
        run: |
          trap 'docker rm -f engine-smoke counsel-smoke 2>/dev/null || true' EXIT
          docker run -d --name engine-smoke --entrypoint /usr/local/bin/engine-mcp -p 18081:8081 \
            ghcr.io/${{ github.repository_owner }}/liki-engine:${{ inputs.version }}
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18081/health && break; sleep 1; done
          python scripts/test_engine_mcp.py http://127.0.0.1:18081/mcp
          docker run -d --name counsel-smoke -p 18086:8086 -e LIKI_MCP_URL=http://127.0.0.1:9/mcp \
            ghcr.io/${{ github.repository_owner }}/liki-counsel:${{ inputs.version }}
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18086/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18086/healthz | grep -q '"status":"ok"'

  release:
    name: Sign and create release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [validate, promote]
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Request Sigstore OIDC token
        env:
          OIDC_AUDIENCE: sigstore
        run: |
          set -euo pipefail
          response="$(mktemp)"
          curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" > "$response"
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["value"])' "$response" > "$RUNNER_TEMP/oidc-token"
          chmod 600 "$RUNNER_TEMP/oidc-token"

      - name: Sign promoted image digests
        env:
          ENGINE_DIGEST: ${{ needs.promote.outputs.engine_digest }}
          COUNSEL_DIGEST: ${{ needs.promote.outputs.counsel_digest }}
          EXPERTS_DIGEST: ${{ needs.promote.outputs.experts_digest }}
          SINGLE_DIGEST: ${{ needs.promote.outputs.single_digest }}
        run: |
          for spec in \
            "liki-engine@$ENGINE_DIGEST" \
            "liki-counsel@$COUNSEL_DIGEST" \
            "liki-multi-expert@$EXPERTS_DIGEST" \
            "liki-single-expert@$SINGLE_DIGEST"; do
            cosign sign --yes --identity-token "$RUNNER_TEMP/oidc-token" "ghcr.io/${{ github.repository_owner }}/$spec"
          done

      - name: Verify promoted image signatures
        env:
          ENGINE_DIGEST: ${{ needs.promote.outputs.engine_digest }}
          COUNSEL_DIGEST: ${{ needs.promote.outputs.counsel_digest }}
          EXPERTS_DIGEST: ${{ needs.promote.outputs.experts_digest }}
          SINGLE_DIGEST: ${{ needs.promote.outputs.single_digest }}
        run: |
          identity="^https://github\\.com/ml8s/liki/\\.github/workflows/promote-release\\.yml@refs/tags/v${{ inputs.version }}$"
          for spec in \
            "liki-engine@$ENGINE_DIGEST" \
            "liki-counsel@$COUNSEL_DIGEST" \
            "liki-multi-expert@$EXPERTS_DIGEST" \
            "liki-single-expert@$SINGLE_DIGEST"; do
            cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "ghcr.io/${{ github.repository_owner }}/$spec"
          done

      - name: Record promoted image digests
        env:
          ENGINE_DIGEST: ${{ needs.promote.outputs.engine_digest }}
          COUNSEL_DIGEST: ${{ needs.promote.outputs.counsel_digest }}
          EXPERTS_DIGEST: ${{ needs.promote.outputs.experts_digest }}
          SINGLE_DIGEST: ${{ needs.promote.outputs.single_digest }}
        run: |
          mkdir -p image-digest
          printf 'engine=%s\n' "$ENGINE_DIGEST" > image-digest/engine.env
          printf 'engine_mcp=%s\n' "$ENGINE_DIGEST" > image-digest/engine_mcp.env
          printf 'counsel_mcp=%s\n' "$COUNSEL_DIGEST" > image-digest/counsel_mcp.env
          printf 'experts=%s\n' "$EXPERTS_DIGEST" > image-digest/experts.env
          printf 'single_expert=%s\n' "$SINGLE_DIGEST" > image-digest/single_expert.env

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-engine
          path: image-digest/engine.env

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-engine_mcp
          path: image-digest/engine_mcp.env

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-counsel_mcp
          path: image-digest/counsel_mcp.env

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-experts
          path: image-digest/experts.env

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-single_expert
          path: image-digest/single_expert.env

      - name: Build signed release manifest
        env:
          PROMOTE_OUTPUTS: ${{ toJSON(needs.promote.outputs) }}
          LIKI_RELEASE_TAG: v${{ inputs.version }}
          LIKI_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          LIKI_RELEASE_IMAGES="$(python3 -c 'import json,sys; o=json.loads(sys.argv[1]); print(json.dumps({"engine":o["engine_digest"],"engine_mcp":o["engine_mcp_digest"],"counsel":o["counsel_digest"],"experts":o["experts_digest"],"single_expert":o["single_digest"]},sort_keys=True))' "$PROMOTE_OUTPUTS")"
          export LIKI_RELEASE_IMAGES
          make build-release-manifest
          python3 scripts/build_release_manifest.py --require-images
          cosign sign-blob --yes \
            --output-signature dist/liki-release-manifest.sig \
            --output-certificate dist/liki-release-manifest.crt \
            dist/liki-release-manifest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf liki-release-artifacts.tar.gz -C dist \
            agents/experts/deployment.json \
            agents/single/deployment.json \
            index.json \
            liki-release-manifest.json \
            liki-release-manifest.sha256 \
            liki-web-skill-bundle.tar.gz \
            liki.tar.gz
          gh release create "v${{ inputs.version }}" \
            --verify-tag \
            --title "Liki ${{ inputs.version }}" \
            --notes "Promoted tested candidate ${{ inputs.candidate_run_id }}. All image digests were retagged, signed, and verified without rebuilding." \
            dist/liki-release-manifest.json \
            dist/liki-release-manifest.sha256 \
            dist/liki-release-manifest.sig \
            dist/liki-release-manifest.crt \
            liki-release-artifacts.tar.gz
