name: Promote release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix'
        required: true
        type: string
      source_commit:
        description: 'Full Git commit SHA containing the tag and tested source'
        required: true
        type: string
      digests_json:
        description: 'Local candidate-digests.json contents'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-promote-release-liki-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  promote:
    name: Promote tested image digests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Validate tag, source, and digest evidence
        id: evidence
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DIGESTS_JSON: ${{ inputs.digests_json }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::version must use date-based CalVer (YYYY.MM.DD.N)" >&2
            exit 1
          fi
          if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_commit must be a full lowercase Git SHA" >&2
            exit 1
          fi
          actual_commit="$(git rev-parse HEAD^{commit})"
          if [ "$actual_commit" != "$SOURCE_COMMIT" ]; then
            echo "::error::tag v$VERSION points to $actual_commit, not $SOURCE_COMMIT" >&2
            exit 1
          fi
          export DIGESTS_JSON
          python3 scripts/validate_candidate_manifest.py \
            --source-commit "$SOURCE_COMMIT" \
            --output "$GITHUB_OUTPUT"
          echo "version_no_v=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: promote
        name: Promote exact candidate digests
        env:
          VERSION: ${{ steps.evidence.outputs.version_no_v }}
          ENGINE_DIGEST: ${{ steps.evidence.outputs.engine_digest }}
          COUNSEL_DIGEST: ${{ steps.evidence.outputs.counsel_digest }}
          EXPERTS_DIGEST: ${{ steps.evidence.outputs.experts_digest }}
        run: |
          set -euo pipefail
          promote() {
            docker buildx imagetools create \
              -t "ghcr.io/${{ github.repository_owner }}/$1:$VERSION" \
              "ghcr.io/${{ github.repository_owner }}/$1@$2"
          }
          promote liki-engine "$ENGINE_DIGEST"
          promote liki-counsel "$COUNSEL_DIGEST"
          promote liki-experts "$EXPERTS_DIGEST"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Sign and verify promoted image digests
        id: sign
        env:
          OIDC_AUDIENCE: sigstore
          VERSION: ${{ steps.evidence.outputs.version_no_v }}
          ENGINE_DIGEST: ${{ steps.evidence.outputs.engine_digest }}
          COUNSEL_DIGEST: ${{ steps.evidence.outputs.counsel_digest }}
          EXPERTS_DIGEST: ${{ steps.evidence.outputs.experts_digest }}
        run: |
          set -euo pipefail
          oidc_token="$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
            | jq -er '.value')"
          for spec in \
            "liki-engine@$ENGINE_DIGEST" \
            "liki-counsel@$COUNSEL_DIGEST" \
            "liki-experts@$EXPERTS_DIGEST"; do
            cosign sign --yes --identity-token "$oidc_token" "ghcr.io/${{ github.repository_owner }}/$spec"
          done
          ref="${GITHUB_REF//./\\.}"
          identity="^https://github\\.com/ml8s/liki/\\.github/workflows/promote-release\\.yml@${ref}$"
          for spec in \
            "liki-engine@$ENGINE_DIGEST" \
            "liki-counsel@$COUNSEL_DIGEST" \
            "liki-experts@$EXPERTS_DIGEST"; do
            cosign verify --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "ghcr.io/${{ github.repository_owner }}/$spec"
          done

      - name: Record promoted image digests
        env:
          ENGINE_DIGEST: ${{ steps.evidence.outputs.engine_digest }}
          COUNSEL_DIGEST: ${{ steps.evidence.outputs.counsel_digest }}
          EXPERTS_DIGEST: ${{ steps.evidence.outputs.experts_digest }}
        run: |
          set -euo pipefail
          mkdir -p image-digest
          printf 'engine=%s\n' "$ENGINE_DIGEST" > image-digest/engine.env
          printf 'engine_mcp=%s\n' "$ENGINE_DIGEST" > image-digest/engine_mcp.env
          printf 'counsel_mcp=%s\n' "$COUNSEL_DIGEST" > image-digest/counsel_mcp.env
          printf 'experts=%s\n' "$EXPERTS_DIGEST" > image-digest/experts.env

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-engine
          path: image-digest/engine.env

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-engine_mcp
          path: image-digest/engine_mcp.env

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-counsel_mcp
          path: image-digest/counsel_mcp.env

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-experts
          path: image-digest/experts.env

      - name: Build signed release manifest
        env:
          ENGINE_DIGEST: ${{ steps.evidence.outputs.engine_digest }}
          COUNSEL_DIGEST: ${{ steps.evidence.outputs.counsel_digest }}
          EXPERTS_DIGEST: ${{ steps.evidence.outputs.experts_digest }}
          LIKI_RELEASE_TAG: v${{ steps.evidence.outputs.version_no_v }}
          LIKI_SOURCE_COMMIT: ${{ github.event.inputs.source_commit || github.sha }}
        run: |
          set -euo pipefail
          LIKI_RELEASE_IMAGES="$(jq -n \
            --arg engine "$ENGINE_DIGEST" \
            --arg counsel "$COUNSEL_DIGEST" \
            --arg experts "$EXPERTS_DIGEST" \
            '{engine: $engine, engine_mcp: $engine, counsel_mcp: $counsel, experts: $experts}')"
          export LIKI_RELEASE_IMAGES
          make build-release-manifest
          python3 scripts/build_release_manifest.py --require-images
          cosign sign-blob --yes \
            --output-signature dist/liki-release-manifest.sig \
            --output-certificate dist/liki-release-manifest.crt \
            dist/liki-release-manifest.json

      - name: Package release evidence
        env:
          VERSION: ${{ steps.evidence.outputs.version_no_v }}
        run: |
          set -euo pipefail
          tar -czf liki-release-artifacts.tar.gz -C dist \
            agents/experts/deployment.json \
            index.json \
            liki-release-manifest.json \
            liki-release-manifest.sha256 \
            liki-web-skill-bundle.tar.gz \
            liki.tar.gz

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: liki-release-artifacts-v${{ steps.evidence.outputs.version_no_v }}
          path: liki-release-artifacts.tar.gz
          retention-days: 30
          if-no-files-found: error
