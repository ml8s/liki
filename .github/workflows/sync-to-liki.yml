name: Sync to liki
on:
  push:
    tags:                # 任何 tag push 皆觸發
  workflow_dispatch:    # （可保留）手動觸發

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ contains(github.ref, 'refs/tags/') && match(github.ref, 'refs/tags/v\\d{4}\\.\\d{2}\\.\\d{2}\\.\\d{6}') }}
    steps:
      - name: Checkout liki‑mingli
        uses: actions/checkout@v4
        with:
          repository: ml8s/liki-mingli
          path: liki-mingli

      - name: Checkout liki (target)
        uses: actions/checkout@v4
        with:
          repository: ml8s/liki
          path: liki
          fetch-depth: 0

      - name: Push to liki (triggered by date‑timestamp tag)
        run: |
          cd liki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          git push https://${{ secrets.SYNC_PAT }}@github.com/ml8s/liki.git main