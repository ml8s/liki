name: Sync to liki
on:
  push:
    tags:                # 任何 tag push 皆触发
  workflow_dispatch:    # （可保留）手動觸發

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout liki‑mingli
        uses: actions/checkout@v4
        with:
          repository: ml8s/liki-mingli
          path: liki-mingli

      - name: Checkout liki (target)
        uses: actions/checkout@v4
        with:
          repository: ml8s/liki
          path: liki
          fetch-depth: 0

      - name: Push to liki if date‑timestamp tag
        if: ${{ github.ref startsWith 'refs/tags/' }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_NAME" =~ ^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[0-9]{6}$ ]]; then
            echo "Tag '$TAG_NAME' is a date‑timestamp → pushing"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git pull --ff-only origin main
            git push https://${{ secrets.SYNC_PAT }}@github.com/ml8s/liki.git main
          else
            echo "Tag '$TAG_NAME' is NOT a date‑timestamp → skipping push"
          fi