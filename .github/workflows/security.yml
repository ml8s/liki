name: Security scans

# 依赖漏洞扫描：从 push CI 拆出为每日定时 + 手动触发（数据变化慢、不占 PR 墙钟）。
on:
  schedule:
    - cron: '53 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  engine-vulnerabilities:
    name: Engine vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: "$(go env GOPATH)/bin/govulncheck ./..."
        working-directory: engine

  python-vulnerabilities:
    name: Python vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - run: python -m pip install pip-audit==2.10.0
      - run: pip-audit -r counsel/requirements.lock --require-hashes --disable-pip
