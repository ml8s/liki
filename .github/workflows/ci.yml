name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - run: python -m pip install pyyaml jsonschema pydantic==2.13.5 ruff==0.16.0
      - run: make check
      - name: Generate deployment artifacts
        run: make build-deployment

  engine-lint:
    name: Engine lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: engine
      - name: go vet
        run: go vet ./...
        working-directory: engine

  engine-vulnerabilities:
    name: Engine vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: "$(go env GOPATH)/bin/govulncheck ./..."
        working-directory: engine

  engine-test:
    name: Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      # The skill-document contract tests resolve counsel field references
      # through scripts/counsel_tool_vocabulary.py, which imports the Pydantic
      # contracts in counsel/app/contracts.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - run: python -m pip install pydantic==2.13.5
      - name: Unit tests with coverage floor
        run: make test-engine-coverage
      - run: go test -tags integration -count=1 -timeout 60s ./internal/mcpcontract/ ./internal/http/ ./internal/engine/bazi/
        working-directory: engine

  skills-test:
    name: Skill tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - run: python -m pip install coverage pytest pyyaml jsonschema pydantic==2.13.5
      - run: make test-python-coverage
      - name: Upload Python coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov
            .coverage
          if-no-files-found: error

  python-vulnerabilities:
    name: Python vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - run: python -m pip install pip-audit==2.10.0
      - run: pip-audit -r counsel/requirements.lock --require-hashes --disable-pip

  counsel-test:
    name: Counsel MCP integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - run: make test-counsel

  archive:
    name: Skill archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: make build-archive

  full-data:
    name: Full assertion coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - run: python -m pip install pytest pyyaml jsonschema
      - run: make full-data

  release-integrity:
    name: Release artifact integrity
    # 镜像包全 public，job token 即可拉取；PR run（含 Dependabot）token 权限
    # 受限，所以只在 main push 跑。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, skills-test, full-data]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - run: python -m pip install pyyaml
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate deployment artifacts with pinned runtime
        run: make runtime-validate
      - name: Build and verify release manifest
        run: |
          make build-release-manifest
          python3 scripts/build_release_manifest.py --check
          if python3 scripts/build_release_manifest.py --require-images >/tmp/require-images.out 2>&1; then
            echo "::error::release manifest accepted an unreleased artifact with empty image digests" >&2
            exit 1
          fi
          grep -q "requires image digests" /tmp/require-images.out
      - name: Package release verification bundle
        run: |
          tar -czf /tmp/liki-release-artifacts.tar.gz \
            -C dist \
            agents/natal/deployment.json \
            agents/divination/deployment.json \
            agents/fengshui/deployment.json \
            agents/naming/deployment.json \
            index.json \
            liki-release-manifest.json \
            liki-release-manifest.sha256 \
            liki-web-skill-bundle.tar.gz \
            liki.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liki-release-artifacts
          path: /tmp/liki-release-artifacts.tar.gz
          retention-days: 30
