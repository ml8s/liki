name: CI

on:
  pull_request:
  push:
    branches: [master, dev]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    name: Check contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml jsonschema ruff==0.16.0
      - run: make check
      - name: Generate and validate deployment artifacts
        run: make build-deployment

  engine-lint:
    name: Engine lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          working-directory: engine

  engine-vulnerabilities:
    name: Engine vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: "$(go env GOPATH)/bin/govulncheck ./..."
        working-directory: engine

  engine-test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - run: go test -race -count=1 -short ./...
        working-directory: engine
      - run: go test -tags integration -count=1 -timeout 60s ./internal/agent/ ./internal/http/ ./internal/engine/bazi/
        working-directory: engine

  skills-test:
    name: Skill contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml jsonschema
      - run: python -m pytest tests/ -q

  python-vulnerabilities:
    name: Python vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.0
      - run: pip-audit -r counsel/requirements.lock --require-hashes --disable-pip

  node-vulnerabilities:
    name: Node vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: npm audit

  counsel-test:
    name: Counsel MCP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: make test-counsel

  archive:
    name: Skill archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: make build-archive

  counsel-image:
    name: Counsel MCP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f counsel/Dockerfile -t liki-counsel:ci .
      - name: Smoke counsel health endpoint
        run: |
          trap 'docker rm -f counsel-smoke 2>/dev/null || true' EXIT
          docker run -d --name counsel-smoke -p 18086:8086 liki-counsel:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18086/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18086/healthz | grep -q '"status":"ok"'
          body='{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
          curl -fsS -X POST http://127.0.0.1:18086/mcp \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            -H 'Accept: application/json, text/event-stream' \
            --data "$body" | grep -q 'io.modelcontextprotocol/serverInfo'

  engine-image:
    name: Engine MCP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f engine/dev/Dockerfile -t liki-engine:ci engine
      - name: Smoke engine MCP image
        run: |
          trap 'docker rm -f engine-image-smoke 2>/dev/null || true' EXIT
          docker run -d --name engine-image-smoke \
            --entrypoint /usr/local/bin/engine-mcp \
            -p 18081:8081 \
            liki-engine:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/health && break
            sleep 1
          done
          python scripts/test_engine_mcp.py http://127.0.0.1:18081/mcp

      - name: Smoke transition JSON-RPC image runtime
        run: |
          trap 'docker rm -f engine-rpc-image-smoke 2>/dev/null || true' EXIT
          docker run -d --name engine-rpc-image-smoke \
            --entrypoint /usr/local/bin/engine-rpc \
            -p 18083:8080 \
            liki-engine:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18083/health && break
            sleep 1
          done
          body='{"jsonrpc":"2.0","id":1,"method":"rpc.discover","params":{}}'
          curl -fsS -X POST http://127.0.0.1:18083/jsonrpc \
            -H 'Content-Type: application/json' \
            --data "$body" | grep -q 'openrpc'

  full-data:
    name: Full assertion coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml jsonschema
      - run: make full-data

  docker-publish:
    name: Publish engine image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [check, engine-lint, engine-vulnerabilities, python-vulnerabilities, node-vulnerabilities, engine-test, skills-test, counsel-test, archive, counsel-image, engine-image, full-data]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image versions
        id: versions
        run: |
          echo "runtime=$(cat engine/cmd/engine-mcp/VERSION)" >> "$GITHUB_OUTPUT"
          echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./engine
          file: ./engine/dev/Dockerfile
          push: true
          id: engine-image
          build-args: |
            VERSION=${{ steps.versions.outputs.runtime }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/liki-engine:${{ steps.versions.outputs.runtime }}
            ghcr.io/${{ github.repository_owner }}/liki-engine:${{ steps.versions.outputs.release }}
            ghcr.io/${{ github.repository_owner }}/liki-engine:sha-${{ github.sha }}
      - name: Smoke published image over MCP
        run: |
          trap 'docker rm -f engine-smoke 2>/dev/null || true' EXIT
          docker run -d --name engine-smoke \
            --entrypoint /usr/local/bin/engine-mcp \
            -p 18082:8081 \
            ghcr.io/${{ github.repository_owner }}/liki-engine:${{ steps.versions.outputs.runtime }}
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18082/health && break
            sleep 1
          done
          python scripts/test_engine_mcp.py http://127.0.0.1:18082/mcp
      - name: Record released image digest
        run: echo "liki-engine=${{ steps.engine-image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  counsel-publish:
    name: Publish counsel image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [check, engine-lint, engine-vulnerabilities, python-vulnerabilities, node-vulnerabilities, engine-test, skills-test, counsel-test, archive, counsel-image, engine-image, full-data]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9697bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image versions
        id: versions
        run: |
          echo "runtime=$(cat counsel/app/VERSION.txt)" >> "$GITHUB_OUTPUT"
          echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./counsel/Dockerfile
          push: true
          id: counsel-image
          build-args: |
            VERSION=${{ steps.versions.outputs.runtime }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/liki-counsel:${{ steps.versions.outputs.runtime }}
            ghcr.io/${{ github.repository_owner }}/liki-counsel:${{ steps.versions.outputs.release }}
      - name: Smoke published counsel image
        run: |
          trap 'docker rm -f counsel-published-smoke 2>/dev/null || true' EXIT
          docker run -d --name counsel-published-smoke -p 18086:8086 \
            ghcr.io/${{ github.repository_owner }}/liki-counsel:${{ steps.versions.outputs.runtime }}
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18086/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18086/healthz | grep -q '"status":"ok"'
      - name: Record released image digest
        run: echo "liki-counsel=${{ steps.counsel-image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-experts:
    name: Publish full-capability experts image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [check, engine-lint, engine-vulnerabilities, python-vulnerabilities, node-vulnerabilities, engine-test, skills-test, counsel-test, archive, counsel-image, engine-image, full-data, docker-publish]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml jsonschema
      - name: Generate deployment artifacts
        run: make build-deployment
      - name: Stage artifacts into image build context
        run: |
          rm -rf assembly/dist
          cp -r dist/agents assembly/dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "runtime=$(cat skills/liki/VERSION.txt)" >> "$GITHUB_OUTPUT"
      - name: Compute deployment digests
        id: digests
        env:
          AGENTS_BASE: ghcr.io/${{ github.repository_owner }}/liki-agents:${{ steps.version.outputs.version }}
        run: |
          for profile in single experts; do
            digest="$(
              docker run --rm -v "$PWD/dist/agents:/deployment:ro" \
                -e LIKI_AGENTS_DEPLOYMENT_FILE=/deployment/${profile}/deployment.json \
                --entrypoint /liki-agents "$AGENTS_BASE" \
                validate -deployment /deployment/${profile}/deployment.json 2>&1 |
                sed -n 's/.*digest=\([^ ]*\).*/\1/p'
            )"
            [ -n "$digest" ] || { echo "failed to compute ${profile} deployment digest"; exit 1; }
            echo "${profile}=${digest}" >> "$GITHUB_OUTPUT"
          done
          base_ref="$(
            docker image inspect --format '{{index .RepoDigests 0}}' "$AGENTS_BASE"
          )"
          case "$base_ref" in
            ghcr.io/*@sha256:*) ;;
            *) echo "failed to resolve immutable liki-agents base digest" >&2; exit 1 ;;
          esac
          echo "base_ref=${base_ref}" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-experts image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./assembly
          file: ./assembly/Dockerfile
          build-args: |
            BASE_IMAGE=${{ steps.digests.outputs.base_ref }}
            PROFILE=experts
            DEPLOYMENT_DIGEST=${{ steps.digests.outputs.experts }}
            VERSION=${{ steps.version.outputs.runtime }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}
          push: true
          id: multi-expert-image
          tags: |
            ghcr.io/${{ github.repository_owner }}/liki-multi-expert:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/liki-multi-expert:${{ steps.version.outputs.runtime }}
      - name: Build and push single-expert image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./assembly
          file: ./assembly/Dockerfile
          build-args: |
            BASE_IMAGE=${{ steps.digests.outputs.base_ref }}
            PROFILE=single
            DEPLOYMENT_DIGEST=${{ steps.digests.outputs.single }}
            VERSION=${{ steps.version.outputs.runtime }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}
          push: true
          id: single-expert-image
          tags: |
            ghcr.io/${{ github.repository_owner }}/liki-single-expert:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/liki-single-expert:${{ steps.version.outputs.runtime }}
      - name: Validate published deployments
        run: |
          for img in \
            ghcr.io/${{ github.repository_owner }}/liki-multi-expert:${{ steps.version.outputs.version }} \
            ghcr.io/${{ github.repository_owner }}/liki-single-expert:${{ steps.version.outputs.version }}; do
            docker run --rm "$img" validate -deployment /deployment/deployment.json
          done
      - name: Record released image digests
        run: |
          echo "liki-multi-expert=${{ steps.multi-expert-image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "liki-single-expert=${{ steps.single-expert-image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-tool-catalog:
    name: Publish MCP tool catalog
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ORAS CLI
        run: |
          curl -sSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            -o /tmp/oras.tar.gz
          tar -C /usr/local/bin -xzf /tmp/oras.tar.gz oras
          oras version
      - name: Publish catalog as OCI artifact
        env:
          GHCR_REF: ghcr.io/${{ github.repository_owner }}/mcp-tool-catalog
        run: |
          version="$(python3 -c 'import json; print(json.load(open("contracts/mcp-tool-catalog.json"))["version"])')"
          runtime="$(python3 -c 'import json; print(json.load(open("contracts/mcp-tool-catalog.json"))["runtime_version"])')"
          oras push --plain-http=false \
            --annotation org.opencontainers.image.title=mcp-tool-catalog \
            --annotation org.opencontainers.image.description="Liki MCP tool catalog" \
            --annotation org.opencontainers.image.version="${version}" \
            --annotation org.liki.runtime-version="${runtime}" \
            "${GHCR_REF}:${version}" \
            contracts/mcp-tool-catalog.json:application/json \
            contracts/mcp-tool-catalog.schema.json:application/schema+json

  publish-web-skill-bundle:
    name: Publish web skill bundle
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [check, engine-lint, engine-vulnerabilities, python-vulnerabilities, node-vulnerabilities, engine-test, skills-test, counsel-test, archive, counsel-image, engine-image, full-data]
    env:
      LIKI_RELEASE_TAG: ${{ github.ref_name }}
      LIKI_SOURCE_COMMIT: ${{ github.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build skill archive and web bundle
        run: |
          make build-web-skill-bundle
      - name: Upload bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/liki-web-skill-bundle.tar.gz \
            dist/liki-web-skill-bundle.sha256 \
            dist/liki-web-skill-bundle.manifest.json \
            dist/liki.tar.gz \
            dist/index.json --clobber
