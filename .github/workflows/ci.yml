name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Python tests (rules engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Check content.sha256 freshness
        # 防止"提交内容与指纹脱节"（历史教训：HEAD 提交 d9057296 与 HEAD 树实际指纹 ad6b75ad 不符，
        # 导致安装副本自检总报"内容滞后"）。改任何分发内容必须同步重新生成 content.sha256。
        # 4 skill（liki-bazi/liki-divination/liki-fengshui/liki-naming）各自校验。
        run: |
          for s in liki-bazi liki-divination liki-fengshui liki-naming; do
            cd "skills/$s"
            FP="$(python3 tools/hash.py .)"
            if [ "$(cat content.sha256)" != "$FP" ]; then
              echo "❌ $s content.sha256 过期：提交值 $(cat content.sha256) ≠ 当前树指纹 $FP"
              echo "   请运行: cd skills/$s && python3 tools/hash.py . content.sha256 并随内容一起提交"
              exit 1
            fi
            echo "✓ $s content.sha256 与树一致"
            cd "$GITHUB_WORKSPACE"
          done
      - name: Run tests
        run: python3 -m pytest tests/ -q --ignore=tests/test_integration.py

  archive:
    name: Build archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill archive
        run: bash scripts/build-archive.sh
