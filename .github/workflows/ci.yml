name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: make gate

  expert-image:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ml8s/agentgo
          ref: main
          path: agentgo
          persist-credentials: false
      - run: make -C agentgo image IMAGE_REGISTRY=liki-local IMAGE_TAG=latest
      - run: make build-expert-image AGENTGO_IMAGE=liki-local/agentgo:latest
      - run: python3 scripts/test_expert_image.py --image liki-local/liki-expert:local
