name: CI

on:
  pull_request:
  push:
    branches: [master, dev]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    name: Check contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml jsonschema ruff==0.16.0
      - run: make check
      - name: Generate and validate deployment artifacts
        run: make build-deployment

  engine-lint:
    name: Engine lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          working-directory: engine

  engine-vulnerabilities:
    name: Engine vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: "$(go env GOPATH)/bin/govulncheck ./..."
        working-directory: engine

  engine-test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - name: Unit tests with coverage floor
        working-directory: engine
        run: |
          go test -race -count=1 -short -coverprofile=coverage.out ./...
          COV=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COV}%"
          if awk -v c="$COV" -v m="85" 'BEGIN {exit !(c < m)}'; then
            echo "❌ Coverage ${COV}% < 85%"; exit 1
          fi
      - run: go test -tags integration -count=1 -timeout 60s ./internal/agent/ ./internal/http/ ./internal/engine/bazi/
        working-directory: engine

  skills-test:
    name: Skill contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml jsonschema
      - run: python -m pytest tests/ -q

  python-vulnerabilities:
    name: Python vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.0
      - run: pip-audit -r counsel/requirements.lock --require-hashes --disable-pip

  node-vulnerabilities:
    name: Node vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - run: npm audit

  counsel-test:
    name: Counsel MCP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: make test-counsel

  archive:
    name: Skill archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: make build-archive

  counsel-image:
    name: Counsel MCP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f counsel/Dockerfile -t liki-counsel:ci .
      - name: Smoke counsel health endpoint
        run: |
          trap 'docker rm -f counsel-smoke 2>/dev/null || true' EXIT
          docker run -d --name counsel-smoke -p 18086:8086 liki-counsel:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18086/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18086/healthz | grep -q '"status":"ok"'
          body='{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
          curl -fsS -X POST http://127.0.0.1:18086/mcp \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            -H 'Accept: application/json, text/event-stream' \
            --data "$body" | grep -q 'io.modelcontextprotocol/serverInfo'

  engine-image:
    name: Engine MCP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f engine/dev/Dockerfile -t liki-engine:ci engine
      - name: Smoke engine MCP image
        run: |
          trap 'docker rm -f engine-image-smoke 2>/dev/null || true' EXIT
          docker run -d --name engine-image-smoke \
            --entrypoint /usr/local/bin/engine-mcp \
            -p 18081:8081 \
            liki-engine:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/health && break
            sleep 1
          done
          python scripts/test_engine_mcp.py http://127.0.0.1:18081/mcp

      - name: Smoke transition JSON-RPC image runtime
        run: |
          trap 'docker rm -f engine-rpc-image-smoke 2>/dev/null || true' EXIT
          docker run -d --name engine-rpc-image-smoke \
            --entrypoint /usr/local/bin/engine-rpc \
            -p 18083:8080 \
            liki-engine:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18083/health && break
            sleep 1
          done
          body='{"jsonrpc":"2.0","id":1,"method":"rpc.discover","params":{}}'
          curl -fsS -X POST http://127.0.0.1:18083/jsonrpc \
            -H 'Content-Type: application/json' \
            --data "$body" | grep -q 'openrpc'

  full-data:
    name: Full assertion coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml jsonschema
      - run: make full-data

  release-integrity:
    name: Release artifact integrity
    runs-on: ubuntu-latest
    needs: [check, skills-test, full-data]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml jsonschema
      - name: Build and verify release manifest
        run: |
          make build-release-manifest
          python3 scripts/build_release_manifest.py --check
          if python3 scripts/build_release_manifest.py --require-images >/tmp/require-images.out 2>&1; then
            echo "::error::release manifest accepted an unreleased artifact with empty image digests" >&2
            exit 1
          fi
          grep -q "requires image digests" /tmp/require-images.out
      - name: Package release verification bundle
        run: |
          tar -czf /tmp/liki-release-artifacts.tar.gz \
            -C dist \
            agents/experts/deployment.json \
            agents/single/deployment.json \
            contracts/agent-definition.schema.json \
            index.json \
            liki-release-manifest.json \
            liki-release-manifest.sha256 \
            liki.tar.gz
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: liki-release-artifacts
          path: /tmp/liki-release-artifacts.tar.gz
          retention-days: 30

  docker-publish:
    name: Publish engine image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [check, engine-lint, engine-vulnerabilities, python-vulnerabilities, node-vulnerabilities, engine-test, skills-test, counsel-test, archive, counsel-image, engine-image, full-data, release-integrity]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Compute image versions
        id: versions
        run: |
          echo "runtime=$(cat engine/cmd/engine-mcp/VERSION)" >> "$GITHUB_OUTPUT"
          echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: engine-image
        with:
          context: ./engine
          file: ./engine/dev/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.versions.outputs.runtime }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/liki-engine:${{ steps.versions.outputs.runtime }}
            ghcr.io/${{ github.repository_owner }}/liki-engine:${{ steps.versions.outputs.release }}
            ghcr.io/${{ github.repository_owner }}/liki-engine:sha-${{ github.sha }}
      - name: Smoke published image over MCP
        run: |
          trap 'docker rm -f engine-smoke 2>/dev/null || true' EXIT
          docker run -d --name engine-smoke \
            --entrypoint /usr/local/bin/engine-mcp \
            -p 18082:8081 \
            ghcr.io/${{ github.repository_owner }}/liki-engine:${{ steps.versions.outputs.runtime }}
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18082/health && break
            sleep 1
          done
          python scripts/test_engine_mcp.py http://127.0.0.1:18082/mcp
      - name: Record released image digest
        run: |
          echo "liki-engine=${{ steps.engine-image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/liki-engine@${{ steps.engine-image.outputs.digest }}"
          mkdir -p image-digest
          printf 'engine=%s\n' "${{ steps.engine-image.outputs.digest }}" > image-digest/engine.env
          printf 'engine_mcp=%s\n' "${{ steps.engine-image.outputs.digest }}" > image-digest/engine_mcp.env
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-engine
          path: image-digest/engine.env
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-engine_mcp
          path: image-digest/engine_mcp.env

  counsel-publish:
    name: Publish counsel image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [check, engine-lint, engine-vulnerabilities, python-vulnerabilities, node-vulnerabilities, engine-test, skills-test, counsel-test, archive, counsel-image, engine-image, full-data, release-integrity]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Compute image versions
        id: versions
        run: |
          echo "runtime=$(cat counsel/app/VERSION.txt)" >> "$GITHUB_OUTPUT"
          echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: counsel-image
        with:
          context: .
          file: ./counsel/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.versions.outputs.runtime }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/liki-counsel:${{ steps.versions.outputs.runtime }}
            ghcr.io/${{ github.repository_owner }}/liki-counsel:${{ steps.versions.outputs.release }}
      - name: Smoke published counsel image
        run: |
          trap 'docker rm -f counsel-published-smoke 2>/dev/null || true' EXIT
          docker run -d --name counsel-published-smoke -p 18086:8086 \
            ghcr.io/${{ github.repository_owner }}/liki-counsel:${{ steps.versions.outputs.runtime }}
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18086/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18086/healthz | grep -q '"status":"ok"'
      - name: Record released image digest
        run: |
          echo "liki-counsel=${{ steps.counsel-image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/liki-counsel@${{ steps.counsel-image.outputs.digest }}"
          mkdir -p image-digest
          printf 'counsel_mcp=%s\n' "${{ steps.counsel-image.outputs.digest }}" > image-digest/counsel_mcp.env
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-counsel_mcp
          path: image-digest/counsel_mcp.env

  publish-experts:
    name: Publish full-capability experts image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [check, engine-lint, engine-vulnerabilities, python-vulnerabilities, node-vulnerabilities, engine-test, skills-test, counsel-test, archive, counsel-image, engine-image, full-data, docker-publish, release-integrity]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml jsonschema
      - name: Generate deployment artifacts
        run: make build-deployment
      - name: Stage artifacts into image build context
        run: |
          rm -rf assembly/dist
          mkdir -p assembly/dist/agents
          cp -r dist/agents/. assembly/dist/agents/
          cp -r skills assembly/dist/skills
          cp -r expert-packs assembly/dist/expert-packs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Compute version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "runtime=$(cat skills/liki/VERSION.txt)" >> "$GITHUB_OUTPUT"
      - name: Compute deployment digests
        id: digests
        env:
          AGENTS_BASE: ghcr.io/${{ github.repository_owner }}/liki-agents:${{ steps.version.outputs.version }}
        run: |
          for profile in single experts; do
            out="$(
              docker run --rm -v "$PWD/dist/agents:/deployment:ro" \
                -e LIKI_AGENTS_DEPLOYMENT_FILE=/deployment/${profile}/deployment.json \
                --entrypoint /liki-agents "$AGENTS_BASE" \
                validate -deployment /deployment/${profile}/deployment.json 2>&1
            )" || true
            digest="$(printf '%s\n' "$out" | sed -n 's/.*digest=\([^ ]*\).*/\1/p')"
            if [ -z "$digest" ]; then
              echo "::error::failed to compute ${profile} deployment digest"
              printf '%s\n' "$out"
              exit 1
            fi
            echo "${profile}=${digest}" >> "$GITHUB_OUTPUT"
          done
          base_ref="$(
            docker image inspect --format '{{index .RepoDigests 0}}' "$AGENTS_BASE"
          )"
          case "$base_ref" in
            ghcr.io/*@sha256:*) ;;
            *) echo "failed to resolve immutable liki-agents base digest" >&2; exit 1 ;;
          esac
          echo "base_ref=${base_ref}" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-experts image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: multi-expert-image
        with:
          context: ./assembly
          file: ./assembly/Dockerfile
          build-args: |
            BASE_IMAGE=${{ steps.digests.outputs.base_ref }}
            PROFILE=experts
            DEPLOYMENT_DIGEST=${{ steps.digests.outputs.experts }}
            VERSION=${{ steps.version.outputs.runtime }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/liki-multi-expert:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/liki-multi-expert:${{ steps.version.outputs.runtime }}
      - name: Build and push single-expert image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: single-expert-image
        with:
          context: ./assembly
          file: ./assembly/Dockerfile
          build-args: |
            BASE_IMAGE=${{ steps.digests.outputs.base_ref }}
            PROFILE=single
            DEPLOYMENT_DIGEST=${{ steps.digests.outputs.single }}
            VERSION=${{ steps.version.outputs.runtime }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/liki-single-expert:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/liki-single-expert:${{ steps.version.outputs.runtime }}
      - name: Validate published deployments
        run: |
          for img in \
            ghcr.io/${{ github.repository_owner }}/liki-multi-expert:${{ steps.version.outputs.version }} \
            ghcr.io/${{ github.repository_owner }}/liki-single-expert:${{ steps.version.outputs.version }}; do
            docker run --rm "$img" validate -deployment /deployment/deployment.json
          done
      - name: Record released image digests
        run: |
          echo "liki-multi-expert=${{ steps.multi-expert-image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "liki-single-expert=${{ steps.single-expert-image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/liki-multi-expert@${{ steps.multi-expert-image.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/liki-single-expert@${{ steps.single-expert-image.outputs.digest }}"
          mkdir -p image-digest
          printf 'experts=%s\n' "${{ steps.multi-expert-image.outputs.digest }}" > image-digest/experts.env
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-digest-experts
          path: image-digest/experts.env

  finalize-release-manifest:
    name: Finalize release manifest
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [release-integrity, docker-publish, counsel-publish, publish-experts]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: liki-release-artifacts
          path: bundle
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: image-digests
      - name: Rebuild final digest-pinned manifest
        env:
          LIKI_RELEASE_TAG: ${{ github.ref_name }}
          LIKI_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          tar -xzf bundle/liki-release-artifacts.tar.gz -C dist
          find image-digests -type f -maxdepth 3 -print -exec cat {} \;
          python3 - "$GITHUB_ENV" <<'PY'
          import json
          import pathlib
          import sys

          images = {}
          for path in sorted(pathlib.Path("image-digests").rglob("*.env")):
              for raw in path.read_text(encoding="utf-8").splitlines():
                  if not raw or raw.startswith("#"):
                      continue
                  key, value = raw.split("=", 1)
                  images[key] = value
          with pathlib.Path(sys.argv[1]).open("a", encoding="utf-8") as fh:
              fh.write("LIKI_RELEASE_IMAGES=")
              fh.write(json.dumps(images, sort_keys=True, separators=(",", ":")))
              fh.write("\n")
          PY
          python3 scripts/build_release_manifest.py --require-images
          cosign sign-blob \
            --yes \
            --output-signature dist/liki-release-manifest.sig \
            --output-certificate dist/liki-release-manifest.crt \
            dist/liki-release-manifest.json
      - name: Upload signed release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/liki-release-manifest.json \
            dist/liki-release-manifest.sha256 \
            dist/liki-release-manifest.sig \
            dist/liki-release-manifest.crt \
            --clobber
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: liki-final-release-manifest
          path: |
            dist/liki-release-manifest.json
            dist/liki-release-manifest.sha256
            dist/liki-release-manifest.sig
            dist/liki-release-manifest.crt

  publish-web-skill-bundle:
    name: Publish web skill bundle
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [check, engine-lint, engine-vulnerabilities, python-vulnerabilities, node-vulnerabilities, engine-test, skills-test, counsel-test, archive, counsel-image, engine-image, full-data, release-integrity]
    env:
      LIKI_RELEASE_TAG: ${{ github.ref_name }}
      LIKI_SOURCE_COMMIT: ${{ github.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build skill archive and web bundle
        run: |
          make build-web-skill-bundle
      - name: Upload bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/liki-web-skill-bundle.tar.gz \
            dist/liki-web-skill-bundle.sha256 \
            dist/liki-web-skill-bundle.manifest.json \
            dist/liki.tar.gz \
            dist/index.json --clobber
