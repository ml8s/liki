name: CI

on:
  pull_request:
  push:
    branches: [master, dev]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    name: Check contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml jsonschema
      - run: make check

  engine-lint:
    name: Engine lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          working-directory: engine

  engine-vulnerabilities:
    name: Engine vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: "$(go env GOPATH)/bin/govulncheck ./..."
        working-directory: engine

  engine-test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - run: go test -race -count=1 -short ./...
        working-directory: engine
      - run: go test -tags integration -count=1 -timeout 60s ./internal/agent/ ./internal/http/ ./internal/engine/bazi/
        working-directory: engine

  skills-test:
    name: Skill contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml jsonschema
      - run: python -m pytest tests/ -q

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.0
      - run: make lint-python

  python-vulnerabilities:
    name: Python vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.0
      - run: pip-audit -r counsel/requirements.lock --require-hashes --disable-pip

  node-vulnerabilities:
    name: Node vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: npm audit

  counsel-test:
    name: Counsel MCP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: make test-counsel

  archive:
    name: Skill archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: make build-archive

  counsel-image:
    name: Counsel MCP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f counsel/Dockerfile -t liki-counsel:ci .
      - name: Smoke counsel health endpoint
        run: |
          trap 'docker rm -f counsel-smoke 2>/dev/null || true' EXIT
          docker run -d --name counsel-smoke -p 18086:8086 liki-counsel:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18086/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18086/healthz | grep -q '"status":"ok"'
          body='{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
          curl -fsS -X POST http://127.0.0.1:18086/mcp \
            -H 'Content-Type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' \
            -H 'Mcp-Method: server/discover' \
            -H 'Accept: application/json, text/event-stream' \
            --data "$body" | grep -q 'io.modelcontextprotocol/serverInfo'

  engine-image:
    name: Engine MCP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f engine/dev/Dockerfile -t liki-engine:ci engine
      - name: Smoke engine MCP image
        run: |
          trap 'docker rm -f engine-image-smoke 2>/dev/null || true' EXIT
          docker run -d --name engine-image-smoke \
            --entrypoint /usr/local/bin/engine-mcp \
            -p 18081:8081 \
            liki-engine:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/health && break
            sleep 1
          done
          python scripts/test_engine_mcp.py http://127.0.0.1:18081

      - name: Smoke transition JSON-RPC image runtime
        run: |
          trap 'docker rm -f engine-rpc-image-smoke 2>/dev/null || true' EXIT
          docker run -d --name engine-rpc-image-smoke \
            --entrypoint /usr/local/bin/engine-rpc \
            -p 18083:8080 \
            liki-engine:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18083/health && break
            sleep 1
          done
          body='{"jsonrpc":"2.0","id":1,"method":"rpc.discover","params":{}}'
          curl -fsS -X POST http://127.0.0.1:18083/jsonrpc \
            -H 'Content-Type: application/json' \
            --data "$body" | grep -q 'openrpc'

  full-data:
    name: Full assertion coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml jsonschema
      - run: make full-data

  docker-publish:
    name: Publish engine image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [check, engine-lint, engine-vulnerabilities, python-lint, python-vulnerabilities, node-vulnerabilities, engine-test, skills-test, counsel-test, archive, counsel-image, engine-image, full-data]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./engine
          file: ./engine/dev/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/liki-engine:latest
            ghcr.io/${{ github.repository_owner }}/liki-engine:sha-${{ github.sha }}
      - name: Smoke published image over MCP
        run: |
          trap 'docker rm -f engine-smoke 2>/dev/null || true' EXIT
          docker run -d --name engine-smoke \
            --entrypoint /usr/local/bin/engine-mcp \
            -p 18082:8081 \
            ghcr.io/${{ github.repository_owner }}/liki-engine:latest
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18082/health && break
            sleep 1
          done
          python scripts/test_engine_mcp.py http://127.0.0.1:18082
