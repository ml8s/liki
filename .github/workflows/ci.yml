name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Python tests (rules engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python3 -m pytest tests/ -q

  archive:
    name: Build archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill archive
        run: bash scripts/build-archive.sh
