name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

# ─────────────────────────────────────────────────────────────
# liki monorepo CI —— engine（Go）+ skills（Python）双栈
# 所有 job 每次 push/PR 全量跑（未做 path filter——monorepo 双栈常联动，
# 引擎/skill 契约一致性优先于跳过节省；如需分流再引入 dorny/paths-filter）：
# - engine-*：lint / unit(race) / integration + RPC 冒烟（build+起服务）
# - skills-*：单测 + 指纹/文档校验 / 数据检查（本地起引擎，不打生产）/ 打包
# - e2e：build+起服务 → skill 全链路集成测试（LIKI_RPC_URL）
# ─────────────────────────────────────────────────────────────

jobs:
  # ── Engine: Lint ──
  engine-lint:
    name: Engine Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: golangci-lint (engine)
        # 官方 Action + 锁定 v2（勿用 go install：golangci-lint 只支持 ≤ 编译它的 Go 版本，
        # 且 v1.64.x 对 Go 1.25+ 已停止维护——配 Go 1.26 属未定义行为）
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.13.1
          working-directory: engine

  # ── Engine: Unit Test ──
  engine-test:
    name: Engine Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: go vet (engine)
        working-directory: engine
        run: go vet ./...
      - name: go test -race -short (engine)
        working-directory: engine
        run: go test -race -count=1 -short ./...

  # ── Engine: Integration + RPC Smoke ──
  engine-integration:
    name: Engine Integration + Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: integration tests (engine)
        working-directory: engine
        run: go test -tags integration -count=1 -timeout 60s ./internal/agent/ ./internal/http/ ./internal/engine/bazi/
      - name: build engine
        working-directory: engine
        run: go build -o /tmp/liki-engine ./cmd/liki/
      - name: start engine
        run: |
          /tmp/liki-engine -addr :8082 &
          echo "pid=$!" > /tmp/liki-engine.pid
          cat /tmp/liki-engine.pid
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null http://localhost:8082/health 2>/dev/null; then
              echo "engine ready"
              exit 0
            fi
            sleep 1
          done
          echo "engine failed to become ready"; exit 1
      - name: RPC smoke test (engine)
        working-directory: engine
        run: |
          bash -n scripts/test-rpc.sh
          scripts/test-rpc.sh http://localhost:8082
      - name: stop engine
        if: always()
        run: kill "$(cat /tmp/liki-engine.pid)" 2>/dev/null || true

  # ── Skills: Python tests (rules engine) ──
  skills-test:
    name: Skills Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Check content.sha256 freshness
        # 防止"提交内容与指纹脱节"（历史教训：HEAD 提交 d9057296 与 HEAD 树实际指纹 ad6b75ad 不符，
        # 导致安装副本自检总报"内容滞后"）。改任何分发内容必须同步重新生成 content.sha256。
        # 4 skill（liki-bazi/liki-divination/liki-fengshui/liki-naming）各自校验。
        run: |
          for s in liki-bazi liki-divination liki-fengshui liki-naming; do
            cd "skills/$s"
            FP="$(python3 tools/hash.py .)"
            if [ "$(cat content.sha256)" != "$FP" ]; then
              echo "❌ $s content.sha256 过期：提交值 $(cat content.sha256) ≠ 当前树指纹 $FP"
              echo "   请运行: cd skills/$s && python3 tools/hash.py . content.sha256 并随内容一起提交"
              exit 1
            fi
            echo "✓ $s content.sha256 与树一致"
            cd "$GITHUB_WORKSPACE"
          done
      - name: Run tests
        run: python3 -m pytest tests/ -q --ignore=tests/test_integration.py
      - name: Run check (schema + docs + version)
        # 快路径自动验证：断语表质量/跨术数/死列（check_schema）+ 文档引用契约（check_docs）
        # + skill-tools.json 版本与 VERSION 一致——改表/改文档后 CI 即拦
        run: bash tests/check.sh

  # ── Skills: Data check (160 题断语覆盖/零命中) ──
  skills-data-check:
    name: Skills Data check (160 题断语覆盖/零命中)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build engine
        working-directory: engine
        run: go build -o /tmp/liki-engine ./cmd/liki/
      - name: start engine
        run: |
          /tmp/liki-engine -addr :8082 &
          echo "pid=$!" > /tmp/liki-engine.pid
          cat /tmp/liki-engine.pid
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null http://localhost:8082/health 2>/dev/null; then
              echo "engine ready"
              exit 0
            fi
            sleep 1
          done
          echo "engine failed to become ready"; exit 1
      - name: Run full data check (eval_hybrid)
        # 慢路径（32 命例全量排盘，数分钟级）：断语覆盖统计 + 零命中题检测——
        # 防"断语表改动后断语丢失/死行"（外部评审 #18 模式）只在全量数据检查暴露
        # 连本地引擎（同仓 build），不依赖生产 liki.hk
        run: bash tests/check.sh --full
        env:
          LIKI_RPC_URL: http://localhost:8082/jsonrpc
      - name: stop engine
        if: always()
        run: kill "$(cat /tmp/liki-engine.pid)" 2>/dev/null || true

  # ── Skills: Build archive ──
  skills-archive:
    name: Skills Build archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill archive
        run: bash scripts/build-archive.sh

  # ── E2E: 全链路（engine + skills 契约一致性）──
  e2e:
    name: E2E (engine + skills integration)
    runs-on: ubuntu-latest
    needs: [engine-lint, engine-test, skills-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: build engine
        working-directory: engine
        run: go build -o /tmp/liki-engine ./cmd/liki/
      - name: start engine
        run: |
          /tmp/liki-engine -addr :8082 &
          echo "pid=$!" > /tmp/liki-engine.pid
          cat /tmp/liki-engine.pid
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null http://localhost:8082/health 2>/dev/null; then
              echo "engine ready"
              exit 0
            fi
            sleep 1
          done
          echo "engine failed to become ready"; exit 1
      - name: skill full-chain integration test (LIKI_RPC_URL)
        # 引擎同仓 build，跑 skill 全链路——彻底消除此前"skill 集成测试依赖外部引擎"的跨仓耦合
        run: |
          LIKI_RPC_URL=http://localhost:8082/jsonrpc python3 -m pytest tests/test_integration.py -q -s
      - name: stop engine
        if: always()
        run: kill "$(cat /tmp/liki-engine.pid)" 2>/dev/null || true

  # ── 镜像发布（release 触发——gh release create 后才发；master push 只测试不发）──
  docker-publish:
    name: Publish engine image (ghcr)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [engine-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (latest + sha 锚)
        uses: docker/build-push-action@v6
        with:
          context: ./engine
          file: ./engine/deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/liki-engine:latest
            ghcr.io/${{ github.repository_owner }}/liki-engine:sha-${{ github.sha }}
      - name: Smoke test (发布物即测试物)
        run: |
          docker run -d --name engine-smoke -p 18082:8080 ghcr.io/${{ github.repository_owner }}/liki-engine:latest
          for i in $(seq 1 15); do curl -sf http://localhost:18082/health && break; sleep 1; done
          bash engine/scripts/test-rpc.sh http://localhost:18082 || { docker rm -f engine-smoke; exit 1; }
          docker rm -f engine-smoke
