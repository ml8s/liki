name: Release publish

# 显式发布：tag 的构建与签名（release.yml）成功后，由此创建 GitHub Release。
# tag push 只构建与签名，绝不自动发布。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vYYYY.MM.DD.N), built & signed by release.yml'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Guard publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if ! [[ "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::tag $tag is not CalVer vYYYY.MM.DD.N" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag" origin/main; then
            echo "::error::tag $tag does not point at a main commit" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub release $tag already exists; releases are immutable" >&2
            exit 1
          fi
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$tag" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::no successful build run for $tag; push the tag and let release.yml finish first" >&2
            exit 1
          fi
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "release-assets-${{ inputs.tag }}" --dir dist/release-assets
          find dist/release-assets -type f | sort

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "liki ${{ inputs.tag }}" \
            --generate-notes \
            dist/release-assets/build/release/* \
            dist/release-assets/dist/*
