# MingLi-Bench 分组 case: pan28（命盘 28/32，5 题）
# 题目与答案分离：答案见 tests/answers.json（判分进程专用；评测期间由 run-qwen.sh 移出隔离）
id: pan28
title: "命盘28：命主儿时家庭情况如何？"
input:
  prompt: |
    出生信息：男命：西元1993年4月8日23:34子时，新加坡出生
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主儿时家庭情况如何？
    选项：
    A.父亲出轨，母亲照顾生活
    B.父母外出工作，由外婆抚养
    C.父亲工作聚少离多，母亲患病
    D.父母离异，跟随母亲改嫁国外
    
    【题2】问题：命主在2001年发生了什么事？
    选项：
    A.遇校园霸凌，申请休学
    B.参与小语种演讲比赛获奖
    C.受伤后发现遗传病，需要长期用药
    D.交通意外，人平安
    
    【题3】问题：命主2022年后的职业行业情况？
    选项：
    A.牧师
    B.入殓师
    C.航运物流管理
    D.传媒业网红
    
    【题4】问题：命主感情状况为何？
    选项：
    A.未婚，单身，恋情多短暂
    B.未婚，有女友交往多年，脚踏两条船
    C.已婚，感情稳定
    D.已婚，矛盾不断，离婚手续中
    
    【题5】问题：命主抑郁症状最严重的年份？
    选项：
    A.2002
    B.2016
    C.2018
    D.2024
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
