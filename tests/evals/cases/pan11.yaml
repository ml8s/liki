# MingLi-Bench 分组 case: pan11（命盘 11/32，5 题）
# 题目与答案分离：答案见 evals/answers.json（判分进程专用）
id: pan11
title: "命盘11：命主在那一年结婚？"
input:
  prompt: |
    出生信息：男命：西历1986年4月24日晚上9.30亥时
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主在那一年结婚？
    选项：
    A.2012
    B.2013
    C.2015
    D.2016
    
    【题2】问题：命主有两名男孩，分别在那年出生？
    选项：
    A.2013与2015
    B.2014与2016
    C.2016与2019
    D.2017与2022
    
    【题3】问题：命主目前的财运？
    选项：
    A.身家超过千万身家（马币）
    B.收入平平，固定薪金4千薪水
    C.财运顺畅，每月收入都有增长
    D.欠债超过1千万的债务
    
    【题4】问题：命主目前婚姻感情状况？
    选项：
    A.己离婚
    B.己婚，但是有婚外情
    C.婚姻美满
    D.未婚，但己有两名孩子
    
    【题5】问题：命主目前职业？
    选项：
    A.小吃店老板
    B.寿板店职员
    C.偏门老板
    D.命理风水顾问
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
