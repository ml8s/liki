# MingLi-Bench 分组 case: pan26（命盘 26/32，5 题）
# 题目与答案分离：答案见 tests/answers.json（判分进程专用；评测期间由 run-qwen.sh 移出隔离）
id: pan26
title: "命盘26：2022年至今，命主的健康状况如何？"
input:
  prompt: |
    出生信息：女命：西历1987年7月5日午时，香港出生
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：2022年至今，命主的健康状况如何？
    选项：
    A.健康少病痛，但有皮肤敏感问题，需要戒吃海鲜
    B.这数年間做过大型手术，曾有生命危险
    C.体弱多病，而且患有糖尿病，病情反复
    D.身材变得肥胖，肝、肠胃问题，以及有脚患困扰
    
    【题2】问题：命主的性格特质、学历水平和现时职业情况如何？
    选项：
    A.平庸懒惰，大学毕业，普通受薪阶层
    B.聪敏不爱读书，中学毕业，兼职为主
    C.不聪敏但勤奋，大学毕业，经营家族生意
    D.聪敏能读书，硕士博士，企业的管理层
    
    【题3】问题：命主在2018年至今的财政和事业运势怎样？
    选项：
    A.感情诈骗导致积蓄至无，幸有固定工作收入稳定
    B.名成利就，工作顺利，个人能力得以发挥
    C.自己当老板，生意额一般，艰辛经营
    D.不停转工，财来财去，与家人同住，日常开支由伴侣负担
    
    【题4】问题：命主现时的婚姻状况如何？
    选项：
    A.婚姻美满，夫妻二人相敬如宾
    B.已婚，但常被配偶言语伤害、责备
    C.离婚后再婚，现时感情稳定
    D.同性恋者，得到伴侣爱护
    
    【题5】问题：现时命主与父母的关系及家庭背景如何？
    选项：
    A.家境富有，不愁衣食，跟母亲感情好，相对父亲关系较疏离
    B.家境曾经小康，父随后生意失败，父母与命主关系正常
    C.从小贫穷，母亲去世，父亲养育命主，并与命主感情好
    D.父母离婚，各自提供基本生活费，并由外婆照顾
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
