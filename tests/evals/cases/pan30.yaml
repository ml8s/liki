# MingLi-Bench 分组 case: pan30（命盘 30/32，5 题）
# 题目与答案分离：答案见 tests/answers.json（判分进程专用；评测期间由 run-qwen.sh 移出隔离）
id: pan30
title: "命盘30：命主的性格和出生背景如何？"
input:
  prompt: |
    出生信息：男命：西历1973年8月24日00:35子时，马来西亚出生
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主的性格和出生背景如何？
    选项：
    A.足智多谋，为人仗义但固执，出生在有钱家庭
    B.脾气暴躁冲动，容易得罪人，出生在贫穷家庭
    C.外表温柔文质彬彬，容易让人误会娘娘腔，出生在中等家庭
    D.为人懒惰不思进取，只顾享乐，出生在富有家庭
    
    【题2】问题：命主喜欢的居家装修风格是？
    选项：
    A.炫酷风格，充满高科技设备
    B.欧式风格，高贵典雅，喜欢收藏古灵精怪摆设
    C.中式风格，复古，喜欢古董和摆设风水物品
    D.环保极简风格，不喜太多摆设
    
    【题3】问题：在丙辰大限（43-52岁），命主在哪一年出国创业，领域为何？
    选项：
    A.2015年，饮食领域
    B.2017年，儿童培训领域
    C.2018年，房地产领域
    D.2019年，酒店住宿领域
    
    【题4】问题：命主在2021年发生何事？
    选项：
    A.疫情过后生意不佳，资金周转困难导致倒闭
    B.回家途中遇到歹徒，被刺伤
    C.母亲染病去世
    D.疫情过后生意峰回路转，蒸蒸日上
    
    【题5】问题：命主在2024年的健康状况如何？
    选项：
    A.健康无碍，只是饮食失调导致肥胖
    B.长期久坐导致脊椎侧弯
    C.经常无节制吸烟，引发鼻癌
    D.被车撞倒，左脚骨折
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
