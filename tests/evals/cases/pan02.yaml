# MingLi-Bench 分组 case: pan02（命盘 2/32，5 题）
# 题目与答案分离：答案见 tests/answers.json（判分进程专用；评测期间由 run-qwen.sh 移出隔离）
id: pan02
title: "命盘2：此命的学历如何？"
input:
  prompt: |
    出生信息：女命：阳历1981年5月26日凌晨02:17 出生地点：中国香港
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：此命的学历如何？
    选项：
    A.中七毕业
    B.2002年升学内地，2006年大学毕业
    C.预科后升本地大学，2004年大学毕业
    D.中五后，1998年出国留学
    
    【题2】问题：这命何时候结婚？
    选项：
    A.2005年结婚
    B.2006年先签纸结婚，2007年摆酒
    C.2012年结婚，旅行外地签纸
    D.2009年结婚
    
    【题3】问题：此命有一名女儿于何年出生？
    选项：
    A.2007年
    B.2009年
    C.2012年
    D.2015年
    
    【题4】问题：身材？
    选项：
    A.高挑，瘦削
    B.高挑，肥胖
    C.矮小，瘦削
    D.矮小，肥胖
    
    【题5】问题：父母情况？
    选项：
    A.1988年父母离异，随母亲成长
    B.1999年父亲出现婚外情，直至2009年父亲离开母亲，但没有离婚
    C.2000年父亲出现婚外情，2021年父母离婚
    D.2003年父母离婚,父亲再婚同年生一子
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
