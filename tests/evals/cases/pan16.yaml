# MingLi-Bench 分组 case: pan16（命盘 16/32，5 题）
# 题目与答案分离：答案见 tests/answers.json（判分进程专用；评测期间由 run-qwen.sh 移出隔离）
id: pan16
title: "命盘16：命主第一次结婚在那一年？"
input:
  prompt: |
    出生信息：男命：西历1980年7月11日已时  香港出生
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主第一次结婚在那一年？
    选项：
    A.2000年
    B.2001年
    C.2005年
    D.2006年
    
    【题2】问题：命主第二次结婚在那一年？
    选项：
    A.2011年
    B.2012年
    C.2013年
    D.2015年
    
    【题3】问题：命主从事那个职业？
    选项：
    A.秘书
    B.物流公司老闆
    C.翻译员
    D.游泳救生员
    
    【题4】问题：命主性格特徵？
    选项：
    A.被动，做事消极，但爱心和同情心重？
    B.鬼主意多，做事喜欢走捷径，耍小聪明
    C.保守，节俭，但承担力强
    D.脾气暴燥，好色，做事鲁莽
    
    【题5】问题：命主在丙戌大运的财政状况？(2009--2018)
    选项：
    A.丙戌大运一直财政稳定，有存款和房产，生活无忧
    B.丙戌大运一直财政很好，常常在投资物业或股票上屡见丰厚获利
    C.丙戌大运刚开始时财政丰盛，但后来因为赌钱而债台高筑
    D.丙戌大运刚开始时平稳渡过，但后来因为要为家人清还债务而负债累累
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
