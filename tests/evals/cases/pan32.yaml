# MingLi-Bench 分组 case: pan32（命盘 32/32，5 题）
# 题目与答案分离：答案见 evals/answers.json（判分进程专用）
id: pan32
title: "命盘32：命主学历状况为何？"
input:
  prompt: |
    出生信息：男命：西元1970年7月22日申时，北京出生
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主学历状况为何？
    选项：
    A.文盲
    B.小学毕业
    C.高中或专科毕业
    D.博士
    
    【题2】问题：命主出社会后的工作是什么？
    选项：
    A.进入工厂，随后进入国企
    B.进入学校担任老师
    C.进入企业担任大企业高管
    D.做小生意，成为企业家
    
    【题3】问题：命主早年一直在北京生活，在哪个岁运搬迁到厦门工作？
    选项：
    A.27-31岁
    B.32-36岁
    C.37-41岁
    D.42-46岁
    
    【题4】问题：命主身体状况为何？
    选项：
    A.从小患有暗疾，影响终身
    B.长期失眠，精神不济
    C.长年运动，身体素质好
    D.身体素质好，但遭遇重大意外导致残缺
    
    【题5】问题：命主一生整体外界对其性格的评价如何？
    选项：
    A.重义气有原则，对外应对得体，深受朋友与长官尊敬
    B.喜欢独处少交际，重视家庭和金钱，家庭稳定
    C.放荡不羁朋友和桃花多，喜高谈阔论，评价褒贬不一
    D.脾气暴躁情绪不稳，家人朋友无法沟通
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
