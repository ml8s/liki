# MingLi-Bench 分组 case: pan24（命盘 24/32，5 题）
# 题目与答案分离：答案见 evals/answers.json（判分进程专用）
id: pan24
title: "命盘24：请问命主在几前被诊断出哪一种疾病？"
input:
  prompt: |
    出生信息：男命：2007年1月31日0900巳时，malaysia出生。
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：请问命主在几前被诊断出哪一种疾病？
    选项：
    A.弱视（斗鸡眼）
    B.心脏有孔
    C.肺炎
    D.地中海贫血症
    
    【题2】问题：此命主的出身贫或富？
    选项：
    A.贫穷家庭长大
    B.小康之家出身
    C.富贵家庭出身
    D.虽有父母，童年却被养在孤儿院
    
    【题3】问题：命主的身材外貌如何？
    选项：
    A.身材高瘦皮肤白皙，细眼薄唇，秀气温文。
    B.身材高大魁梧，浓眉大眼，外表威严。
    C.身材矮瘦皮肤蜡黄，五官扁平，其貌不扬。
    D.身材偏矮微胖，圆脸咪眼，外表和善。
    
    【题4】问题：命主在2016年，家里发生了什么事？
    选项：
    A.父亲破产，被判入穷籍
    B.婆婆因急病去世
    C.父亲严重车祸，休养在家，无法工作。
    D.父母离异
    
    【题5】问题：命主父亲现在的身家？
    选项：
    A.失业在家，入不敷出。
    B.小康家庭
    C.千万身家（马币）
    D.亿万身家（马币）
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
