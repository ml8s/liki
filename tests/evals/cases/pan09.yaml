id: pan09
title: "命盘9：此命的性格特徵如何？"
input:
  prompt: |
    出生信息：女命：西历1966年10月18日夜晚23:15香港出生
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：此命的性格特徵如何？
    选项：
    A.急性子，容易被别人影响决定，表达能力差，对朋友豪爽
    B.喜欢投诉，常说自己苦，易发脾气，不易信人
    C.贪财好胜，权力欲重，固执己见，喜命令别人
    D.贪生怕死，不懂交际，少说法多做事，守财节俭
    
    【题2】问题：那个行业合乎此命情况？
    选项：
    A.律师
    B.销售员
    C.地产生意
    D.图书馆文员
    
    【题3】问题：此命叔叔是出家人，于那年跳楼亡？
    选项：
    A.1982
    B.1984
    C.1986
    D.1988
    
    【题4】问题：此命到现在的婚姻情况如何与及其学历？
    选项：
    A.单身，从未结过婚，没有子女。大学毕业
    B.已婚，有子女，正常普通家庭。大学毕业
    C.已离婚，没有子女。没有大学毕业
    D.同性恋，有女朋友，有一养女，没有大学毕业
    
    【题5】问题：2008年到现在，那个合乎其命运情况？
    选项：
    A.移民新加坡，半炒股半退休的休閒富裕生活
    B.叔叔死后多年的保险法律完结，得保险金而富裕在香港生活
    C.酒后开车，意外撞死人，坐过多年牢。虽有自己私楼，平民生活
    D.突然全身多病，四处求医而医不好，风光过一时的生活，转变为穷困疗倒，住公屋
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
