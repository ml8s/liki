# MingLi-Bench 分组 case: pan29（命盘 29/32，5 题）
# 题目与答案分离：答案见 tests/answers.json（判分进程专用；评测期间由 run-qwen.sh 移出隔离）
id: pan29
title: "命盘29：命主目前的工作和生活情况如何？"
input:
  prompt: |
    出生信息：乾造：西历1988年1月10日早上8时12分，马来西亚出生
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主目前的工作和生活情况如何？
    选项：
    A.在私人企业上班，超过十万存款，生活稳定
    B.自我经营做老板，有负债
    C.在普通公司里打工，月光族
    D.在私人企业做高管，收入稳定，自己也有开店经营买卖
    
    【题2】问题：命主在2004年发生了什么事？
    选项：
    A.读书时期，被人举报与女生有亲密行为，被赶出学校
    B.上学时发生车祸，伤了手脚
    C.参加制服团体举办的行走比赛，队伍拿到第一名
    D.离校去摩托车店做学徒
    
    【题3】问题：命主在哪一年结婚？
    选项：
    A.2021
    B.2017
    C.2022
    D.2016
    
    【题4】问题：命主现在的婚姻与子女状况如何？
    选项：
    A.已婚，育有3个孩子，流产2个
    B.离婚，育有2个孩子，流产1个
    C.二婚，育有1个孩子
    D.已婚，没有子嗣
    
    【题5】问题：命主个性及特色如何？
    选项：
    A.自私、贪心、好色
    B.可靠、慷慨、不怕事，风流，女人缘好
    C.内向，沉默寡言，情绪化
    D.外向胆大好出风头，急性子
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
