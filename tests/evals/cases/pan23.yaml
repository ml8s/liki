# MingLi-Bench 分组 case: pan23（命盘 23/32，5 题）
# 题目与答案分离：答案见 evals/answers.json（判分进程专用）
id: pan23
title: "命盘23：命主的学业状况如何？"
input:
  prompt: |
    出生信息：女命：1980年9月21日早上11：25午时，出生malaysia
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主的学业状况如何？
    选项：
    A.小学毕业
    B.初中辍学
    C.专科毕业
    D.博士学位
    
    【题2】问题：命主的婚姻狀況如何？
    选项：
    A.未婚，育有二女
    B.已婚，育有二子
    C.离婚，育有一子一女
    D.已婚，育有一子一女
    
    【题3】问题：命主在2017年和2019年發生了什麼事？
    选项：
    A.开刀生小孩
    B.交通意外
    C.考取文凭失利
    D.流产
    
    【题4】问题：命主的兩個孩子是哪一年出生的？
    选项：
    A.2020年女孩，2021年男孩
    B.2013年，2015年两个女孩
    C.2017年，2019年两个男孩
    D.2013年男孩，2015年女孩
    
    【题5】问题：命主毕业后从事什么行业？
    选项：
    A.中学教师
    B.公司主管
    C.房屋经纪
    D.会计
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
