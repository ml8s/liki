    选项：
    A.1991
    B.1992
    C.1993
    D.1994
    
    【题4】问题：请问以下哪年命主忽然赚到大钱，受不了孩子抱怨，决定买房解决孩子读书的通勤问题?
    选项：
    A.1996年
    B.2003年
    C.2005年
    D.2008年
    
    【题5】问题：请问以下哪年命主发现长久的乳房硬块转变为乳癌，检查后开刀十分顺利，平安无事？
