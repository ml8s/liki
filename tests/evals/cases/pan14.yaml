    【题2】问题：请问以下哪年命主通灵，晚上梦到各路神明来报六合彩号码(台湾早年的地下博弈)她跟她大姐说，她姐赚到上千万台币横发买房?
    选项：
    A.1987
    B.1989
    C.1990
