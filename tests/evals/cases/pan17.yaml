# MingLi-Bench 分组 case: pan17（命盘 17/32，5 题）
# 题目与答案分离：答案见 evals/answers.json（判分进程专用）
id: pan17
title: "命盘17：下列哪一个描述符合命主的出身状况？"
input:
  prompt: |
    出生信息：女命：1980年8月24日下午16:30 广东
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：下列哪一个描述符合命主的出身状况？
    选项：
    A.出身贫穷，家庭借贷度日，导致经常欠债。
    B.出身普通，虽不捉襟见肘，可惜盈余不多。
    C.出身中产，父为专业人士，家庭颇有盈余。
    D.出身大富，父母经商有道，家族颇多地产。
    
    【题2】问题：下列哪一项描述了合命主要的学业状况？
    选项：
    A.只有小学程度学历。
    B.只有中学程度学历。
    C.拥有大学程度学历。
    D.拥有硕士程度学历。
    
    【题3】问题：下列哪一项描述了主要的配偶工作状况？
    选项：
    A.配偶是打工仔一名，普通职级收入，对家庭没有助力。
    B.配偶是打工仔一名，中高职级收入，对家庭很有助力。
    C.配偶经商，败多于成，颇多外债，对家庭没有助力。
    D.配偶经商，成多于败，颇有盈余，对家庭很有助力。
    
    【题4】问题：下列哪一项描述了合命主的子息状况？
    选项：
    A.没有子女，因身体不能生育。
    B.有三女一子。
    C.只有一子，2004甲申年出生。
    D.只有一女，2010庚寅年出生。
    
    【题5】问题：在2022年壬寅年，下列哪一项是命主的婚姻经历？
    选项：
    A.命主之前已有外遇，2022年被丈夫发现，但得到丈夫原谅，至今未离婚。
    B.命主之前已有外遇，2022年被丈夫发现，得不到丈夫原谅，当年离婚。
    C.丈夫之前已有外遇，2022年被命主发现，但得到命主原谅，至今未离婚。
    D.丈夫之前已有外遇，2022年被命主发现，得不到命主原谅，当年离婚。
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
