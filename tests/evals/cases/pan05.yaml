# MingLi-Bench 分组 case: pan05（命盘 5/32，5 题）
# 题目与答案分离：答案见 evals/answers.json（判分进程专用）
id: pan05
title: "命盘5：以下哪一段描述最符合命主个性？"
input:
  prompt: |
    出生信息：男命：公历1985年6月29日18时32分（酉时）出生地点：malaysia
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：以下哪一段描述最符合命主个性？
    选项：
    A.谨慎小心，从不冒险
    B.脾气暴躁， 自暴自弃
    C.先斩后奏，闯祸后就逃避
    D.苦口婆心， 啰啰嗦嗦
    
    【题2】问题：问命主在几时结婚？（公历）
    选项：
    A.2017年3月
    B.2019年11月
    C.至今未婚
    D.2018年6月
    
    【题3】问题：2009年发生何事？
    选项：
    A.和黑道人物的女人发生关系，被追杀
    B.和朋友创业，被股东诈骗
    C.中彩票，获得十数万现金
    D.发生车祸受重伤，在医院数月
    
    【题4】问题：前半年的2022发生什么事情？
    选项：
    A.创业并获得巨额融资
    B.犯下刑事罪被告上法庭
    C.父亲受伤进医院
    D.工作上立大功被提拔成管理层
    
    【题5】问题：请命主的学历如何？
    选项：
    A.大学/大专毕业
    B.中学/高中毕业
    C.专业技术学校毕业
    D.小学未读完就辍学
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
