id: pan03
title: "命盘3：女生和父母、兄弟姐妹的关系如何？"
input:
  prompt: |
    出生信息：女命（佩小姐）：1990年05月23日17：30 出生地点：中国大陆
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：女生和父母、兄弟姐妹的关系如何？
    选项：
    A.从小父母疼爱呵护，兄弟姐妹关系融洽
    B.从小父母疼爱呵护，兄弟姐妹关系淡薄
    C.小时不在父母身边长大，吃百家饭，兄弟姐妹关系融洽
    D.小时不在父母身边长大，吃百家饭，兄弟姐妹关系淡薄
    
    【题2】问题：佩小姐目前的工作情况和生活情况如何？
    选项：
    A.在事业单位/国企上班，有几十万存款，生活稳定
    B.在家全职太太，老公赚钱养家
    C.自我经营做老板，有负债
    D.在普通公司里打工，月光族
    
    【题3】问题：这位女士佩的婚姻仔女如何？
    选项：
    A.未婚，没孩子
    B.已婚，没孩子
    C.已婚，有孩子
    D.离异，有孩子
    
    【题4】问题：佩小姐在下面哪一年的工作有新的突破发展？
    选项：
    A.2014年
    B.2016年
    C.2018年
    D.2021年
    
    【题5】问题：以下描述中比较符合佩小姐是什么？
    选项：
    A.自私自利，喜欢向别人索取，易怒，蛮横无理
    B.外冷内热，习惯付出，耳根子软不善拒绝，被家人压榨欺负
    C.外柔内刚，很有主见，善于表面一套背地里一套，交际能手
    D.强势固执，猜忌多疑，不喜欢外出，孤僻没朋友
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

