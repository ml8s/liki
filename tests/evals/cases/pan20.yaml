# MingLi-Bench 分组 case: pan20（命盘 20/32，4 题）
# 题目与答案分离：答案见 tests/answers.json（判分进程专用；评测期间由 run-qwen.sh 移出隔离）
id: pan20
title: "命盘20：第一段婚姻什么时候结婚？"
input:
  prompt: |
    出生信息：女命：1983年10月28日丑时农历：癸亥年九月二十三丑时。
    
    以下是同一命盘（同一位命主）的 4 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 4 道题（不要每题重新排盘）。
    
    【题1】问题：第一段婚姻什么时候结婚？
    选项：
    A.2003
    B.2005
    C.2007
    D.2009
    
    【题2】问题：命主第一段婚姻的原因是？
    选项：
    A.奉子成婚
    B.长辈逝世,为冲喜结婚
    C.商业利益,家族联婚
    D.缺家庭关怀,随便找人嫁
    
    【题3】问题：命主那一年结束了第一段婚姻？
    选项：
    A.2011搬离, 2012结束
    B.2013搬离,2014结束
    C.2015搬离,2016结束
    D.2017搬离,2018结束
    
    【题4】问题：婚姻终止的原因。
    选项：
    A.受丈夫暴力对待
    B.命主暴力对待丈夫
    C.半斤八两,互殴
    D.丈夫逝世
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-4，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
