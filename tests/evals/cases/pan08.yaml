# MingLi-Bench 分组 case: pan08（命盘 8/32，5 题）
# 题目与答案分离：答案见 tests/answers.json（判分进程专用；评测期间由 run-qwen.sh 移出隔离）
id: pan08
title: "命盘8：命主出生时的家庭环境如何？"
input:
  prompt: |
    出生信息：男命公历1981年6月17日（戌时）出生地点：中国香港
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主出生时的家庭环境如何？
    选项：
    A.家境错误
    B.不过不失
    C.小康之家
    D.富裕家庭
    
    【题2】问题：命主的婚姻状况？
    选项：
    A.仍然单身
    B.同居生活
    C.已婚
    D.已离婚
    
    【题3】问题：命在2014年曾接受手术，手术器官？
    选项：
    A.心脏
    B.脑部
    C.双腿
    D.手肘
    
    【题4】问题：命主职业是？
    选项：
    A.保险从业员
    B.零售业
    C.文员
    D.的士司机
    
    【题5】问题：命主2020/2021年的经济状况是？
    选项：
    A.月光族
    B.欠下债务
    C.薄有积蓄
    D.财务自由
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
