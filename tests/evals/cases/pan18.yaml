# MingLi-Bench 分组 case: pan18（命盘 18/32，5 题）
# 题目与答案分离：答案见 tests/answers.json（判分进程专用；评测期间由 run-qwen.sh 移出隔离）
id: pan18
title: "命盘18：命主的性格和情绪？"
input:
  prompt: |
    出生信息：男性：生于公元1972年1月8日午时，农历辛亥11月22日午时。于潮汕地区出生。
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主的性格和情绪？
    选项：
    A.孤僻、不合群、忧郁。
    B.戇直、表里如一。有暴力倾向。
    C.为人儒雅，爱虫鱼书画之乐。
    D.乐于交际。独处之时，又自得其乐。
    
    【题2】问题：命主的男女关系和婚姻状况？
    选项：
    A.一生未娶。
    B.已娶妻。关系良好，未见有异。
    C.于虚龄24至33期间娶妻。但因妻子过于情绪化，而影响了感情。
    D.于虚龄34至43娶妻。但婚后不久，妻即离世。
    
    【题3】问题：命主事业上的特色？
    选项：
    A.承继了兄长的畜牧场。
    B.曾任公务员。但因涉嫌刑事案件，而要提早退休。
    C.建筑工人。
    D.成功商人，以零售起家。
    
    【题4】问题：命主的母亲于哪年离世？
    选项：
    A.1989
    B.1990
    C.2011
    D.2021
    
    【题5】问题：命主于虚龄34至43岁的田宅运？
    选项：
    A.通过买卖房产而得厚利。
    B.获分配到公屋。
    C.落了订金购买自住物业后，因未能成功获得银行贷款，而被卖家没收订金。
    D.因投资失利，而要卖屋偿还债务。
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
