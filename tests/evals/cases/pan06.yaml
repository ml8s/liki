# MingLi-Bench 分组 case: pan06（命盘 6/32，5 题）
# 题目与答案分离：答案见 tests/answers.json（判分进程专用；评测期间由 run-qwen.sh 移出隔离）
id: pan06
title: "命盘6：这个人的爱情问题如何？"
input:
  prompt: |
    出生信息：男命：公历1983年11月1日（亥时） 出生地点：中国台湾
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：这个人的爱情问题如何？
    选项：
    A.单身，曾交往几任却都无疾而终
    B.有稳定交往多年对象，但仍未婚
    C.曾有一段婚姻，但于2021年离婚
    D.已婚，家庭幸福且育有一子
    
    【题2】问题：命主学历及工作为何？
    选项：
    A.只有高职毕业，在市场摆摊赚钱
    B.大学毕业，目前在小公司当助理
    C.硕士毕业，大学担任高级研究员
    D.博士毕业，上市公司担任工程师
    
    【题3】问题：命主曾被骗钱，请问在何时？
    选项：
    A.2014年
    B.2018年
    C.2019年
    D.2021年
    
    【题4】问题：命主个性及特色原因？
    选项：
    A.精神亢奋常坐不住，像个过动儿
    B.经常运动，体力好且有强健体魄
    C.喜好交友，但真心朋友寥寥无几
    D.待人和善且严以律己，寛以待人
    
    【题5】问题：命主理财能力如何？
    选项：
    A.虽赚的不多，但很会理财，已购置一栋房子
    B.很没理财观念，赚的钱皆由母亲代为管理
    C.家境优渥，是个很会乱花钱的富二代
    D.相当投机，赚的钱几乎都投入股市，但赚少赔多
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
