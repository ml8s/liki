# MingLi-Bench 分组 case: pan10（命盘 10/32，5 题）
# 题目与答案分离：答案见 tests/answers.json（判分进程专用；评测期间由 run-qwen.sh 移出隔离）
id: pan10
title: "命盘10：命主16岁前家庭状况？"
input:
  prompt: |
    出生信息：男命：西历1962年8月6日已时-农历1962七月初七/巳时
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主16岁前家庭状况？
    选项：
    A.跟随母亲生活
    B.在孤儿院长大
    C.跟随父亲生活
    D.跟随收养父母生活
    
    【题2】问题：命主父母状况？
    选项：
    A.父母相继在儿时离世
    B.父亲短寿，母亲长寿
    C.家境贫穷，父母无法养育命主而分离
    D.父亲长寿，母亲短寿
    
    【题3】问题：命主婚姻状况？
    选项：
    A.已婚，但已离异
    B.一直独身，清心寡欲
    C.独身，经常嫖妓
    D.已婚，婚姻生活稳定
    
    【题4】问题：2014年，命主发生何事？
    选项：
    A.命主伴侣患癌症
    B.命主兄弟姐妹中有人患癌症
    C.命主父亲或母亲患癌症
    D.命主自己患癌症
    
    【题5】问题：以下那一项，在命主中反映才属正确？
    选项：
    A.独子，没有兄弟姐妹
    B.曾犯事，留有案底
    C.长期患病，需要人照顾
    D.工作稳定，毕业后一份工作做到退休
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"

judge:
  type: script
  script_path: grade-case.py
