id: pan27
title: "命盘27：命主出身及家庭情况如何？"
input:
  prompt: |
    出生信息：男命：西历1983年4月21日上午6-7时，日本宫崎县出生
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主出身及家庭情况如何？
    选项：
    A.出生后次年母亲去世，父亲为小型企业主，再婚后又生一弟一妹
    B.父亲为政府高级职员，2021年去世，命主有一兄一姐
    C.母亲是家庭主妇，父亲为小型企业主，命主有一弟
    D.1986年父亲去世，母亲继承产业守寡至今，命主有一姐一弟
    
    【题2】问题：命主的样貌、性情、爱好及职业为何？
    选项：
    A.腿脚残疾脾气怪，喜好文艺爵士与古典音乐，现为萨克斯手兼乐团老板
    B.身材高大魁梧，性情固执，喜好音乐，现为酒吧老板
    C.中等身材，勤奋叛逆，喜好拳击、橄榄球等运动，现为餐厅老板
    D.早产且身体不好，喜好园艺，现为小型地产经纪公司老板
    
    【题3】问题：命主的学历和职业状况如何？
    选项：
    A.重点大学医学类专业，毕业后转行，2013年从事现在工作
    B.重点大学文科毕业，2011年进入现工作，2019年曾因事判监半年
    C.高中毕业，边打工边学习，2014年得贵人提携进入现在工作
    D.重点大学文科专业，中途退学，2021年进入现在工作
    
    【题4】问题：命主的婚恋和子女情况如何？
    选项：
    A.婚恋不顺，经人介绍，2011年结婚，2014年生育一女
    B.2011年与中学同学奉子成婚，关系平淡，2012年生一子，2015年生次子
    C.多次恋爱，至今未婚，无子女
    D.2018年离婚后一直独身，无子女
    
    【题5】问题：2022年命主发生了什么重要事件？
    选项：
    A.母亲去世
    B.外出旅行时遭遇车祸受伤
    C.染患新冠并引发其他病症，住院治疗四个多月
    D.事业受阻欠债，只能卖房填补漏洞
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"
