id: pan22
title: "命盘22：1998年开始-1999年结束的感情对象"
input:
  prompt: |
    出生信息：女命：公元1983年3月26日未时，农历1983癸亥年，二月十二日，未时生，北京出世。
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：1998年开始-1999年结束的感情对象类型，分手原因？
    选项：
    A.高富帅，冷酷。分手原因-冷暴力，消失不见。
    B.矮帅，学渣。分手原因-花女人钱，爱PUA。
    C.书呆子，学霸。分手原因-太爱批评。
    D.痞子，学渣。分手原因-脚踏两船
    
    【题2】问题：1999年恋爱，2002年分手。
    选项：
    A.高富帅，热心体贴。分手原因，命主外遇。
    B.长相普通，善良。分手原因，家庭反对。
    C.肥壮，大男子主义。分手原因，控制欲过强。
    D.瘦高，胆小怕事。分手原因，毕业后异地发展而分手。
    
    【题3】问题：2002年认识，大學師兄。
    选项：
    A.富二代，玩世不恭。离婚原因，对方花心出轨。
    B.帅气，聪明有才。离婚原因，吵架多，命主离家修行。
    C.高大，大男人主义。离婚原因，婚后为钱吵架，家暴。
    D.矮帅，多金。离婚原因，命主出轨。
    
    【题4】问题：2012-2013之间，发生了一件严重的事，遇到一个桃花帮助了自己？
    选项：
    A.误入歧途，被骗去外地工作，某暧昧同事把自己救出去。
    B.投资失误，欠了几百万，某暧昧富豪，借钱给自己渡过难关。
    C.严重意外导致无法工作，对自己有意思的大叔给自己生活费。
    D.遇到宗教老千，倾家荡产，某暧昧富豪提供了自己金钱帮助。
    
    【题5】问题：2019年开始，2021年结束，桃花类型，分手原因？
    选项：
    A.小鲜肉，甜言蜜语。分手原因，对方花心被抓。
    B.已婚男。分手原因，欺骗自己，没离婚。
    C.与前夫旧情复燃，分手原因，个性不合，吵架多。
    D.事业成功人士，分手原因，命主占有欲过强，对方提出分手。
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"
