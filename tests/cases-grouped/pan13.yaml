# MingLi-Bench 分组 case: pan13（命盘 13/32，5 题）
# 题目与答案分离：答案见 evals/answers.json（判分进程专用）
id: pan13
title: "命盘13：命主在2011年发生什么事？"
input:
  prompt: |
    出生信息：女命：西历1978年04月05日17：00-19：00酉时  台湾生
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主在2011年发生什么事？
    选项：
    A.成立公司
    B.拿到usa永久绿卡
    C.投资获利千万
    D.什么事情都没有发生
    
    【题2】问题：以下事项，哪个在2009年没有发生？
    选项：
    A.考上律师
    B.远距离旅行
    C.找到工作
    D.购置不动产
    
    【题3】问题：命主何时结婚？
    选项：
    A.2006
    B.2007
    C.2008
    D.2009
    
    【题4】问题：命主在哪一年生孩子？
    选项：
    A.生于阳历2012期间
    B.生于阳历2013期间
    C.生于阳历2015期间
    D.生于阳历2018期间
    
    【题5】问题：生产状况为？
    选项：
    A.男婴
    B.女婴
    C.双胞胎
    D.难产
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"
