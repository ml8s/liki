id: pan07
title: "命盘7：此命之性格？"
input:
  prompt: |
    出生信息：女命公历1984年12月9日（酉时） 出生地点：中国香港
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：此命之性格？
    选项：
    A.勤俭顾家，知书识礼，明辨是非
    B.好勇争胜，说话霸气，说胜才止
    C.心多贪权，急于求成，见困难挫折而离弃
    D.胆小怕事，心气压抑，欠缺当机立断心志
    
    【题2】问题：此命祖上富，因父好赌，何年破产？
    选项：
    A.1995
    B.1997
    C.2003
    D.2007
    
    【题3】问题：何年在牢狱几个月？
    选项：
    A.2003
    B.2007
    C.2010
    D.2016
    
    【题4】问题：此命于2005年拍拖，于何年结婚？
    选项：
    A.2008
    B.2010
    C.2012
    D.2014
    
    【题5】问题：此命的感情生活情况？
    选项：
    A.夫妻恩爱，而且一心一意，夫妻同心照顾孩子
    B.丈夫外有情人，但家用充足，命主在家照顾孩子，后离婚
    C.丈夫不给家用更有情人，命主只好打工照顾孩子，后离婚
    D.丈夫生意失败而离家出走，只好打工帮丈夫还债及照顾孩子
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
