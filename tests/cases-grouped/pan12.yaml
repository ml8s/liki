# MingLi-Bench 分组 case: pan12（命盘 12/32，5 题）
# 题目与答案分离：答案见 evals/answers.json（判分进程专用）
id: pan12
title: "命盘12：命主性格如何？"
input:
  prompt: |
    出生信息：男命，西历1956年3月11日巳时，malaysia出生
    
    以下是同一命盘（同一位命主）的 5 道命理题。请按 liki skill 流程**先排盘一次**（调用排盘 RPC 获取完整四柱/大运/紫微），然后基于同一份命盘数据依次分析并作答这 5 道题（不要每题重新排盘）。
    
    【题1】问题：命主性格如何？
    选项：
    A.自私，贪心，好色
    B.胆小，怕事，没主见
    C.内向，沉默寡言
    D.外向胆大好胜，急性子
    
    【题2】问题：命主学历如何？
    选项：
    A.小学毕业
    B.中学辍学
    C.大学毕业
    D.硕士毕业
    
    【题3】问题：命主婚姻状况？
    选项：
    A.已婚，无儿女
    B.已婚，育2男1女
    C.早年结婚，晚年离婚
    D.未婚
    
    【题4】问题：命主在1997年发生何事?
    选项：
    A.接获诈骗电话，骗走百万存款
    B.发生严重车祸，昏迷3个月
    C.与友人合伙投资，出国寻二战后宝藏
    D.自创业，开办大型港式酒家
    
    【题5】问题：命主身体健康状况？
    选项：
    A.2011年血管阻塞，轻微中风
    B.2013年心脏搭桥手术
    C.2016年确诊癌症，隔年与世长辞
    D.2020年确诊新冠，肺部感染死亡
    
    要求：逐题分析，每题给出结论后，**单独一行输出：题N 答案：X**（N 为题号 1-5，X 为 A/B/C/D）。
    注意：本评测无人值守、无用户可应答。若排盘需要确认信息（如出生城市/经度/时区），请按 skill 文档默认值处理（usa 默认经度 -75，其余按 skill 规则），直接继续分析，禁止向用户提问。
    
    输出格式强制（必须严格遵守，否则判为无效）：
    分析全部结束后，**最后单独输出 N 行**（N=题数），每行严格为：
    题1 答案：X
    题2 答案：X
    ……
    要求：
    - 每行只有「题N 答案：X」，禁止写「答案：A B C」一行多字母，禁止在分析中途插入答案行
    - 不要重复输出答案（每题只出现一次，出现在最后）
    - 最终答案以最后几行为准
expect:
  must_contain:
    - "答案"
