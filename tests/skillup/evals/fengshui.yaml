schema_version: v1alpha1
skills:
  - source: local_path
    path: ../../skills/liki-fengshui
    exclude:
      - ".git/**"
      - "dist/**"
      - ".run-eval.*.yaml"
      - ".setup/**"
environment:
  type: docker
  image: liki-qwen:1
  workspace_mount: /workspace
  env:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL}
    QWEN_CODE_MAX_OUTPUT_TOKENS: "16384"
    LIKI_RPC_URL: ${LIKI_RPC_URL}
engine:
  name: qwen_code
  model:
    name: ${OPENAI_MODEL}
    max_tokens: 16384
cases:
  files:
    - cases/bazhai-minggua.yaml
    - cases/bazhai-layout.yaml
    - cases/xuankong-chart.yaml
    - cases/xuankong-liunian.yaml
    - cases/fengshui-incomplete.yaml
  defaults:
    timeout_seconds: 900
    max_turns: 14
report:
  formats: [json, markdown]
