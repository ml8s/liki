# skill-up accuracy benchmark —— MingLi-Bench 命盘分组版（32 命盘 × 4-6 题 = 160 题）。
# 本配置只测命理答案准确率；跨领域功能 smoke 在 tests/skillup/。
# 用法：bash tests/benchmark/mingli160/run.sh
#
# 布局说明（skill-up eval 参考解析基准 = tests/benchmark/mingli160/）：
#   - eval.yaml 在 tests/benchmark/mingli160/evals/，基准解析目录是其上级 tests/benchmark/mingli160/
#   - cases.files / skills.path 均相对该基准目录解析：
#       cases:     evals/cases/pan01.yaml          → tests/benchmark/mingli160/evals/cases/pan01.yaml
#       skills:    ../../../skills/liki-bazi       → <仓库根>/skills/liki-bazi
#   - 答案文件不进 skill——run.sh 运行前 stash 隔离（容器 agent 读不到）
#   - 答案隔离不变量：容器只挂载 skills/liki-bazi（skills.path），tests/ 不进容器——
#     grade-case.py 内嵌答案留在仓库树内因此安全；若改挂载范围（如挂仓库根），
#     必须先把 grade-case.py 移出 agent 可读范围，否则答案泄漏
#   - 产物输出由 run.sh 的 --output-dir 指到 tests/benchmark/mingli160/workspace/（不入库不进包）
schema_version: v1alpha1

skills:
  - source: local_path
    path: ../../../skills/liki-bazi
    exclude:            # 只装 skill 本体（~1MB）：跳过 .git 历史与构建产物
      - ".git/**"
      - "dist/**"
      - ".run-eval.*.yaml"
      - ".setup/**"

environment:
  type: docker
  image: liki-qwen:1
  workspace_mount: /workspace
  env:
    # key 由 run.sh 运行前 sed 注入（占位符防 key 入库；skill-up 不展开 ${VAR}）
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL}
    QWEN_CODE_MAX_OUTPUT_TOKENS: "32768"
    # 本地引擎端点由 run.sh 注入（容器内经 bridge 网关访问宿主本地引擎；skill_up 评测脱离生产 liki.hk）
    LIKI_RPC_URL: ${LIKI_RPC_URL}

engine:
  name: qwen_code
  model:
    name: ${OPENAI_MODEL}
    max_tokens: 32768

cases:
  files:
    - evals/cases/pan01.yaml
    - evals/cases/pan02.yaml
    - evals/cases/pan03.yaml
    - evals/cases/pan04.yaml
    - evals/cases/pan05.yaml
    - evals/cases/pan06.yaml
    - evals/cases/pan07.yaml
    - evals/cases/pan08.yaml
    - evals/cases/pan09.yaml
    - evals/cases/pan10.yaml
    - evals/cases/pan11.yaml
    - evals/cases/pan12.yaml
    - evals/cases/pan13.yaml
    - evals/cases/pan14.yaml
    - evals/cases/pan15.yaml
    - evals/cases/pan16.yaml
    - evals/cases/pan17.yaml
    - evals/cases/pan18.yaml
    - evals/cases/pan19.yaml
    - evals/cases/pan20.yaml
    - evals/cases/pan21.yaml
    - evals/cases/pan22.yaml
    - evals/cases/pan23.yaml
    - evals/cases/pan24.yaml
    - evals/cases/pan25.yaml
    - evals/cases/pan26.yaml
    - evals/cases/pan27.yaml
    - evals/cases/pan28.yaml
    - evals/cases/pan29.yaml
    - evals/cases/pan30.yaml
    - evals/cases/pan31.yaml
    - evals/cases/pan32.yaml
  defaults:
    timeout_seconds: 2400
    max_turns: 20

report:
  formats: [json, markdown]
